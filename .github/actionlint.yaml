# actionlint only knows GitHub-hosted labels; register the vmon runner labels
# (infra/docs/01-vmon-runners.md) so `runs-on: vmon-large/from=omp-ci` lints
# clean.
self-hosted-runner:
   labels:
      - vmon-large/from=omp-ci
# actionlint 1.7.12 does not know the jobs context's `result`, which GitHub
# documents for a reusable workflow's outputs (contexts reference, "jobs
# context": jobs.<job_id>.result). sami-rust-test.yml gives its two jobs'
# results to sami-checks' summary that way.
paths:
   .github/workflows/sami-rust-test.yml:
      ignore:
         - 'property "result" is not defined in object type \{outputs: \{\}\}'
# actionlint 1.7.12 does not know cache-mode either (a workflow's and a job's
# GitHub Actions cache access), which sami-checks.yml and sami-rust-test.yml
# set to none on the workflow and on each calling job. Any other unknown key,
# a misspelled cache-mode among them, still fails.
   .github/workflows/*.yml:
      ignore:
         - 'unexpected key "cache-mode" for "(workflow|job)" section'

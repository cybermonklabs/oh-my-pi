# sami checks: the tests the release owner used to run by hand before a cut, run on every push of
# a release candidate. Report only: nothing here gates a release. publish reads only
# sami-build.yml's run of the candidate, never this workflow's, and a red row here is fixed
# forward.
#
# When it runs.
#   - A push to release-candidate tests the pushed commit (sami fast-forwards to that same commit
#     later, so sami itself is not tested again).
#   - A dispatch tests any pushed commit, given as a full 40-character id:
#       gh workflow run sami-checks.yml --repo cybermonklabs/oh-my-pi --ref <branch with this file> \
#         -f commit=<sha> [-f rows=<row>,<row>...] [-f silent=<job name>] [-f plant=docs|changelog|rustfmt|membench|builtins-lint|bazel-lock] [-f previous=<run id>]
#     `rows` selects the rows the run runs: all (the default), or a comma list of the summary's row
#     names (sc.py ROW_KEYS): set-runner, set-root, lib4, builtins, workspace, ts-small, ts-ca,
#     checkts, macos, windows, clippy, skipforms, gv-set-uid1000, gv-set-root, gv-lib4-uid1000,
#     gv-lib4-root, gv-builtins-uid1000, gv-builtins-root, gv-orphan-uid1000, gv-orphan-root, docs,
#     changelog, rustfmt, membench, builtins-lint, bazel-lock, rust_test, rust_test_macos. A name that
#     is no row fails the plan, which lists them.
#     The plan runs the jobs whose results the selected rows read and the jobs those need by their
#     `needs:` (the reference tools, the test archive, the host addon), and no other job: a proof of
#     the docs row builds nothing else. A row reads the same alone as in a run of every row, so rows
#     that read the same jobs run together (sc.py row_work): both users' pi-shell sets and lib4 (a
#     self-skip as one user is covered by the other user's pass); both users' gVisor set, lib4 and
#     orphan rows; both users' gVisor pi-builtins; rust_test and rust_test_macos; and skipforms with
#     every row whose passing tests' output its run-time half reads. The summary reads every other
#     row NOT RUN and says that the run covered a subset. A push to release-candidate (the cut) runs
#     every row, and no control, whatever an input says.
#     `silent` is the summary's control: the named job (for example set-root-2) uploads nothing,
#     and the summary must then read its units and its row UNKNOWN. `silent=macos-bash` instead
#     makes the macOS legs skip their bash 5 install, and the macOS row must read UNKNOWN.
#     `plant` is the docs, changelog, rustfmt, membench, builtins-lint or bazel-lock row's control:
#     that job first adds a fault to the tree (sc.py PLANTS: a doc comment with a broken intra-doc
#     link, an empty CHANGELOG heading, a function rustfmt would space out at the end of each cargo
#     workspace's first target root, a 1 MiB reserve in the kernel a pi-shell Shell owns, which the
#     memory bench's shell line must read as a MISS, two consts at the end of pi-builtins' library
#     root, one clippy reports and one rustfmt would space out, each unit's own, or a comment line at
#     the end of the root Cargo.toml, which MODULE.bazel.lock records), and the summary says at its
#     top whether the row then read FAIL naming it. A silent or plant whose job or row the run does
#     not run fails the plan: that control would pass quietly.
#     `previous` names the run whose sc-report the summary compares this run's failures with (first
#     seen at this cut): a run id. Empty, the default, takes the newest completed run on a push of
#     release-candidate before this one, of another commit. A run with no sc-report to read (none,
#     or one past its 30 days) makes first seen read UNKNOWN, and the summary says why.
#   GitHub dispatches only a workflow it has seen run, and this file is not on the default branch
#   (main); the pushes of release-candidate run it.
#
# What it runs. One cargo build of every test target of the root workspace, archived by
# `cargo nextest archive`; the test jobs run that archive and compile nothing:
#   - the pi-shell set: each pi-shell test binary (the lib's, obash's, every tests/*.rs one) in a
#     libtest process of its own at --test-threads=4 with a hang bound, as the runner's user and
#     as root, each over 4 shards balanced by measured time (.github/sami-checks/pi-shell-seconds.txt);
#   - the pi-shell lib in one libtest process at 4 threads: the runner's run of the lib binary in
#     the set, read as its own row;
#   - pi-builtins under nextest's default profile, with the tree's own .config/nextest.toml, as
#     the runner's user and as root;
#   - the rest of the root workspace under nextest, in 2 partitions, as both users;
#   - TypeScript: natives, utils, scripts/ci-release-publish.test.ts and mnemopi --isolate in one
#     job; coding-agent --isolate over 10 shards by file; check:ts. The host addon they load is
#     built once, in the natives job.
#   - the Rust tests under Bazel (`bazel test //crates/...` with the known-failure gate, the other
#     cargo workspaces, sdk/rust/omp-rpc among them, and the tests only macOS can run): the
#     rust-test and rust-test-macos jobs call .github/workflows/sami-rust-test.yml, one for each of
#     its two jobs, which build their own tests. rust-test-macos starts when the build job ends:
#     that job writes each Bazel rust_test's Linux listing from its test binaries
#     (.github/sami/rust-test-early-listings.sh), and rust-test-drift compares them with rust_test's
#     own as soon as it ends. The summary has a row for each of the two jobs, read from that job's
#     result; a drift fails rust_test's row.
#   - macOS and Windows: platform-checks.yml (the fork's platform checks, a called workflow) builds
#     pi-shell's tests once per platform on macos-15 and windows-2025 and runs them under nextest;
#     the summary reads its own report (pc-report) as one unit per platform.
#   - clippy: cargo clippy --tests --no-deps --keep-going --message-format=json -- --cap-lints warn of
#     pi-shell, pi-vcs, pi-vfs, pi-walker, pi-builtins and pi-natives, one unit per crate, then each
#     crate again with an unused import planted as its control (.github/sami-checks/clippy.sh). A
#     crate fails only on findings beyond .github/sami-checks/clippy-baseline.txt, the findings the
#     release already has (the cut's rule, at no second build); its header says how to regenerate
#     it. It lints Linux code only; code built only for macOS or Windows is compiled, not linted, in
#     the platform rows. cargo builds no unit whose dependency did not compile, so each unit of a
#     crate (its lib, bins and tests, from cargo metadata) that the log shows was not linted reads
#     UNKNOWN, named; a finding the crate's run did read still fails it.
#   - rustfmt: cargo fmt --all --check -v in each cargo workspace the gate builds, the root one and
#     each one .github/sami/rust-test-cargo-workspaces.txt lists (sdk/rust/omp-rpc), one unit per
#     workspace, each place rustfmt would change named by path and line (.github/sami-checks/
#     rustfmt.sh). rustfmt reads the rustfmt.toml nearest each file, so those workspaces take the
#     root's, as a developer's cargo fmt there does. A place on lines the fork left as they are,
#     whose run fails the same check at the tree's upstream base (its merge base with upstream's
#     main, fetched in the job), is upstream's own and reads KNOWN; a place a fork change brought
#     reads FAIL; one in a file the base's check did not read stays UNKNOWN.
#   - membench: pi-shell's memory bench (crates/pi-shell/benches/memory.rs), as `cargo bench -p
#     pi-shell --bench memory` builds it (cargo's bench profile, which inherits the release profile)
#     on the tree's toolchain, cold, then run once (.github/sami-checks/membench.sh). One unit: FAIL
#     when a target line reads MISS or the bench exits other than 0; UNKNOWN when it did not build,
#     the time bound or a signal ended it, or it printed no target line. The summary lists its exit
#     and every line it printed. The bench's verdicts were printed only, so nothing read them before.
#   - builtins-lint: pi-builtins, which the clippy row reads under the crate's own [lints] (every
#     clippy group allowed) and the rustfmt row never reads (rustfmt.toml ignores it), under both
#     tools with those opt-outs lifted in the job's checkout: the crate's [lints] becomes the
#     workspace's, and the ignore drops the crate (.github/sami-checks/builtins-lint.sh). Two units:
#     clippy (--all-targets, every lint capped at warn so the crate's tests are linted too) and
#     rustfmt (cargo fmt --check), each finding named by path and line. A finding on lines the fork
#     left as they are, which the same check at the tree's upstream base also reports there, is
#     upstream's own and reads KNOWN; one a fork change brought reads FAIL; one in a file the base's
#     check did not read stays UNKNOWN (the rustfmt row's base, .github/sami-checks/upstream-base.sh).
#     The summary counts each unit's findings by lint and by file.
#   - bazel-lock: whether MODULE.bazel.lock is current for the tree: the tree's own `bun
#     scripts/gen-bazel-lock.ts --check` (bazelisk fetch --repo=@crates --lockfile_mode=error) in the
#     fixed environment of .github/sami/bazel-lock.sh, the one sami-build.yml's bazel_lock
#     regenerates the lock in (.github/sami-checks/bazel-lock.sh). One unit: FAIL only when Bazel
#     names a file of the tree that changed, each file whose sha256 differs from the lock's record of
#     it named; UNKNOWN when Bazel reads the lock stale for anything else (an environment variable,
#     the extension's definition or usages: the lock records eight CARGO_BAZEL_* and REPIN variables,
#     and .bazelrc imports an optional .bazelrc.user), or did not answer. A stale lock builds the same
#     outputs, only slower: every fresh Bazel server evaluates the crate extension again. A cut whose
#     row reads FAIL is one sami-build.yml's bazel_lock did not regenerate.
#   - under gVisor (sami-checks-gvisor.yml): the pi-shell set (and so the one-process lib) and
#     pi-builtins again, from the same archive, in a runsc container, as uid 1000 and as root.
# The tests run against zsh 5.9, rsync 3.5.1 and jj 0.46.0 built or fetched from pinned sources
# in the tools job (.github/sami-checks/tools.sh), on hosts .github/sami-checks/host.sh sets up.
# sdk/rust/omp-rpc is its own cargo workspace and is not in the archive (sami-rust-test.yml runs it).
#
# Where the result is. The summary job's step summary: a row per check (PASS, FAIL or UNKNOWN),
# its units' counts, each failing test by name, each UNKNOWN with its reason, the 20 slowest tests
# and the units by time. A unit whose runner did not end normally (libtest 0 or 101, nextest 0 or
# 100, bun 0 or 1 with its summary line, JUnit report and matching counts, clippy 0 or 101 with its
# control caught and every unit of its crate linted), in which a passing test printed a skip
# marker (unless the same test passed as
# the other user, or each skip line is a sub-case .github/sami-checks/partial-skips.txt lets that
# test skip and its witness line is in its output: a partial pass, listed), whose platform the
# platform checks gave no verdict, or that no job or two jobs reported, is UNKNOWN, and so is its
# row unless another of its units failed (a fault outranks a unit that could not be read). A row
# the run did not select reads NOT RUN, never PASS. The summary step exits 0 when every row that
# ran passed, 1 when it found a fault (a row failed, a known-failure entry is listed for removal,
# or the run is planted: a planted run always fails), and 2 when a row is UNKNOWN and it found no
# fault, or when the summary stopped before its verdict: 2 says the run could not look, and is
# never the code of a fault. The summary job fails on 1 and on 2 alike, so the run is red unless
# every row that ran passed; the summary's first line under its verdict says which exit it is and
# names the rows. The step summary's first line, `sami-checks verdict: {...}`, is that result as one JSON
# object (also the summary job's output `verdict`, a notice on the summary job and sc-report's
# verdict.json): `verdict` over the rows that ran (FAIL when a row failed, a known-failure entry is
# listed for removal or the run is planted; else UNKNOWN when a row is UNKNOWN; else PASS, KNOWN
# rows passing), `subset` (true unless every row ran), `rows_run`, `rows_not_run`, `rows` (each
# row's verdict, or NOT RUN), and `plant` and `plant_caught` (null unless a row was planted). Only
# a run with subset false and verdict PASS is a pass of the cut checks.
# First seen at this cut: the summary compares each failure with the previous cut's report (the
# sc-report of the run `previous` names, by default the newest completed push of release-candidate
# before this run, of another commit: the step "The previous cut's report", sc.py previous-report).
# Each failure that report does not hold, compared without the line or column that moves when
# other lines of the tree move (sc.py FINDING_MOVES), or holds fewer times, heads the step
# summary, before the table and the standing failures, and is an entry of verdict.json's
# `first_seen` (kind, row, who, unit, finding, reading NEW or KNOWN, and in `previous` the
# evidence); a unit with failures and no
# result there is one entry, and a Rust row, compared by its verdict, another. When the previous
# report cannot be read, `first_seen` is the string UNKNOWN, never an empty list, and
# `first_seen_why` says why; `first_seen_against` names the report, `first_seen_not_compared` what
# could not be compared, and on a planted run `plant_first_seen` says whether the plant read first
# seen: the comparison's own control.
# Artifacts: sc-report (summary.md, verdict.json, and results.json, each unit's result, which the
# next cut's summary compares with), sc-res-<job> (each unit's result and log), sc-build, and the
# platform checks' own (pc-report, pc-results-*, pc-build-*).
# Known failures: .github/sami-checks/known-failures.txt names tests that fail on every tree for a
# reason the tree does not own yet; the summary shows each failure KNOWN (with the reason) or NEW, a
# unit whose only failures are known reads KNOWN unless a test in it skipped itself and passed as no
# other user, an entry of unit `*` names its test in any unit (shard) of its row, and an entry whose
# test passed is listed for removal and fails the summary, unless its reason starts `flaky: `. A
# failed test with a `flaky: ` entry makes its job run the whole unit again, at most twice, with the
# same threads and user (set.sh, nextest.sh, ts.sh), and reads KNOWN only when it passed in such a
# retry; a nextest JUnit case that failed and then passed on nextest's own retry is flaky, not a
# pass. A `skips: ` entry names a self-skip by row, user, test and the start of its skip line, and
# that self-skip reads KNOWN. pi-builtins' check_folded_sources tests run in a directory where names
# fold (host.sh: ext4 casefold; nextest.sh SC_FOLDED). Each `bun test` gets the per-test timeout
# the tree's own runner gives it (ts.sh: scripts/ci-test-ts.ts and ci.yml's OMP_TEST_TIMEOUT), not
# bun's 5 s. The browser tests run against the Chrome for Testing build the tree's puppeteer-core
# pins (bun.sh chrome), not the runner's google-chrome. Skip prints: the skip-forms job fails on a print of the
# tree that says skip and that the summary's rule does not read; the summary job runs the same check
# on every line a passing test printed (sc.py skip-lines), and both are units of the row "skip
# prints the summary reads".
# Docs and CHANGELOGs: the docs job runs `cargo doc --no-deps -p pi-shell` with
# -D rustdoc::broken_intra_doc_links on the tree's toolchain, cold like the build job, twice: as
# published (unit `public`) and with --document-private-items (unit `private`), and names each
# broken link by path, line and link text (docs.sh). The changelog job runs
# `bun scripts/fix-changelogs.ts --check` on a checkout with the full history and tags (the tool
# reads its baseline from the latest v* tag) and names each CHANGELOG the tool would rewrite with
# the first lines it changes (changelog.sh). Both start with the plan and add no time to the run.
#
# Caches. No job restores or saves a GitHub Actions cache (cache-mode: none for the whole run).
# The build job compiles dev-dependencies, build scripts and proc macros that release_binary never
# runs, and a dispatch can name any pushed commit; with cache access on release-candidate either
# could plant an entry release_binary restores. So every run builds cold: about 15 min for the
# tests' cargo build and 17 min for the addon on the first runs; bun install takes about 2 s. The
# rust-test jobs call their workflow with cache-mode none, and that workflow declares none too; the
# called platform checks get none too, because GitHub passes this run's cache-mode to them as their
# limit.
# The seed. The two Rust gate jobs are the exception to building cold, and staying off the Actions
# cache is what makes it safe: on the cut, seed-linux and seed-macos build this commit's own Bazel
# targets, with no test and no root setup, and upload the Bazel disk and repository caches as an
# artifact kept 3 days (sc-seed-linux, sc-seed-macos), with its sha256 as a job output and in their
# log. The gate jobs download it, check that sha256, and unpack it into Bazel's disk cache; a miss
# or a difference builds cold (.github/sami/gate-seed.sh, which always writes which path it took:
# GATESEED path=seeded|cold). Nothing a gate job writes can reach release_binary, because no gate
# job holds a cache token at all; the readers hold actions: read, with which they download another
# run's artifact and read its log, and the repository is public. Measured on 2026-11-26 (runs
# 45761221875 to 45818591837): the Linux Rust job falls from a 60.6 min median to 39.1 and the macOS
# one from 48.5 to 39.3, about 1,840 job minutes a day at 11-25's volume. Every test still runs:
# gate-seed.sh adds test --cache_test_results=no.
# The control. On every fifth cut (the N of the newest `sami release CutN` ancestor) and on any
# dispatch with seed=build, rust-test-cold runs the Linux gate again with no seed and
# rust-test-compare checks that the two runs agree test by test; a difference fails the rust_test
# row.
# Security. permissions: contents: read; no secrets; every checkout drops its credential. The one
# exception is on paper only: the platforms job grants actions: write, because GitHub checks the
# called platform-checks.yml's cache-prune job against it before the run starts; that job runs only
# on a dispatch of platform-checks.yml itself, so no job of this workflow ever holds the grant.
# The summary job holds actions: read, with which it finds the previous cut's run and downloads its
# sc-report (sc.py previous-report); the repository is public, so it reads nothing private.
name: sami checks

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('sami checks {0}{1}{2}{3}', inputs.commit, inputs.rows != 'all' && format(' (rows: {0})', inputs.rows) || '', inputs.silent != '' && format(' (control: silent={0})', inputs.silent) || '', inputs.plant != '' && format(' (control: plant={0})', inputs.plant) || '')
  || github.ref == 'refs/heads/release-candidate' && format('sami checks {0} (release-candidate)', github.sha) }}

on:
  push:
    branches:
      - release-candidate
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to test: a full 40-character id, pushed to this repository"
        required: true
        type: string
      rows:
        description: "Rows to run: all, or a comma list of the summary's row names (for example docs,changelog); the others read NOT RUN"
        required: false
        default: "all"
        type: string
      silent:
        description: "Control: a job name (for example set-root-2) that uploads nothing, or macos-bash (the macOS legs skip their bash 5 install)"
        required: false
        default: ""
        type: string
      plant:
        description: "Control: docs, changelog, rustfmt, membench, builtins-lint or bazel-lock, a row whose job first plants a fault the row must name"
        required: false
        default: ""
        type: string
      seed:
        description: "The Rust gate's build seed: auto (the newest cut's seed), build (this run builds its own and runs the cold control beside it) or off (every job builds cold)"
        required: false
        default: "auto"
        type: string
      previous:
        description: "The run whose sc-report the summary compares this run's failures with (first seen at this cut): a run id, or empty for the newest completed push of release-candidate before this run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

cache-mode: none

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  NEXTEST_VERSION: "0.9.151"
  SC: ${{ github.workspace }}/sc
  SC_TREE: ${{ github.workspace }}/tree
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  SC_TEST_PATH: /opt/sc-ref/bin:/usr/local/bin:/usr/bin:/bin
  # The hang bound of one pi-shell test binary, in seconds.
  SC_BIN_BOUND: "1800"
  # The FIFO the sticky-directory FIFO tests open as the runner's user (host.sh makes it).
  SC_STICKY_FIFO: /mnt/sc/sticky/report.txt

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      # The rows this run runs (a comma list of sc.py ROW_KEYS), and the jobs it runs (a JSON list):
      # every job but this one and the summary runs only when its if: finds its id in `jobs`.
      rows: ${{ steps.plan.outputs.rows }}
      jobs: ${{ steps.plan.outputs.jobs }}
      silent: ${{ steps.plan.outputs.silent }}
      set: ${{ steps.plan.outputs.set }}
      set_shards: ${{ steps.plan.outputs.set_shards }}
      workspace: ${{ steps.plan.outputs.workspace }}
      workspace_parts: ${{ steps.plan.outputs.workspace_parts }}
      builtins: ${{ steps.plan.outputs.builtins }}
      ts: ${{ steps.plan.outputs.ts }}
      ca_shards: ${{ steps.plan.outputs.ca_shards }}
      platforms: ${{ steps.plan.outputs.platforms }}
      platform_crates: ${{ steps.plan.outputs.platform_crates }}
      platform_partitions: ${{ steps.plan.outputs.platform_partitions }}
      platform_retries: ${{ steps.plan.outputs.platform_retries }}
      clippy_crates: ${{ steps.plan.outputs.clippy_crates }}
      gvisor: ${{ steps.plan.outputs.gvisor }}
      gv_set_shards: ${{ steps.plan.outputs.gv_set_shards }}
      plant: ${{ steps.plan.outputs.plant }}
      # The Rust gate jobs' build seed (build, auto or off) and whether the cold control runs.
      seed: ${{ steps.plan.outputs.seed }}
      seed_control: ${{ steps.plan.outputs.seed_control }}
    steps:
      # .github/workflows: the plan reads each job's needs: from sami-checks.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          # The candidate's last 300 commits, for the cut number the step below reads; blobless,
          # so this brings commits and trees, not the files of 300 commits.
          fetch-depth: 300
          filter: blob:none
          sparse-checkout: |
            .github/sami-checks
            .github/sami
            .github/workflows
      - name: Controls of the counters, the plan and the summary (hand-made inputs)
        run: python3 tool/.github/sami-checks/sc.py selftest
      # The release this candidate carries: the newest `sami release CutN` commit in its history
      # (the cut itself, or the release under the landings pushed since). The seed's cold control
      # runs on every fifth cut; a candidate with no such commit in its last 300 runs none, and the
      # plan says so rather than read the silence as a no.
      - name: The cut this candidate carries
        id: cut
        if: ${{ github.event_name == 'push' }}
        working-directory: tool
        run: |
          n="$(git log -n 300 --format=%s | sed -n 's/^sami release Cut\([0-9][0-9]*\) .*$/\1/p' | head -n 1)"
          echo "the newest sami release commit of the last 300: ${n:-none}"
          echo "cut=$n" >>"$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          SC_INPUT_COMMIT: ${{ inputs.commit }}
          SC_INPUT_ROWS: ${{ inputs.rows }}
          SC_INPUT_SILENT: ${{ inputs.silent }}
          SC_INPUT_PLANT: ${{ inputs.plant }}
          SC_INPUT_SEED: ${{ inputs.seed }}
          SC_CUT: ${{ steps.cut.outputs.cut }}
        run: python3 tool/.github/sami-checks/sc.py plan | tee -a "$GITHUB_OUTPUT"

  tools:
    # zsh 5.9, rsync 3.5.1 and jj 0.46.0 from pinned sources; no tree code runs here.
    name: reference tools
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'tools')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - name: Build
        run: bash tool/.github/sami-checks/tools.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/up/sc-tools.tgz
          retention-days: 3
          if-no-files-found: error

  build:
    name: build the tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The listing step's outcome: rust-test-macos runs only on a success.
    outputs:
      listings: ${{ steps.listings.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami-checks
            .github/sami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The Bazel half of the listing step below (rust-test-early-listings.sh bazel): cargo
      # metadata, the query of each rust_test's crate root, and a Linux Bazel build of the
      # rust_tests no cargo test target is. It needs no cargo build, so it runs in the
      # background while cargo builds: its analysis alone fetched for 10 min in run 45559853019.
      # It writes its exit status to early-state/bazel.rc last, and stops its Bazel server.
      - name: The Bazel half of the Linux listings, in the background
        working-directory: tree
        run: |
          mkdir -p "$SC"
          (bash ../tool/.github/sami/rust-test-early-listings.sh bazel "$SC/early-state"; bazelisk shutdown) </dev/null >"$SC/early-bazel.log" 2>&1 &
          echo "$!" >"$SC/early-bazel.pid"
          echo "the Bazel half runs as process $(cat "$SC/early-bazel.pid"), into $SC/early-state"
      - name: Build and archive
        run: bash tool/.github/sami-checks/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-archive
          path: ${{ github.workspace }}/sc/up/tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Each Bazel rust_test's Linux listing, for rust_test_macos's inventory: from the archive's
      # test binaries, mapped to their targets by crate root as rust-test-parity.sh maps them, and
      # the Bazel half's listings of the rust_tests no binary is
      # (.github/sami/rust-test-early-listings.sh archive). It waits for the Bazel half (at most
      # its 20 min). A binary that maps to no target or to two, or a target left without a
      # listing, fails the step by name; rust-test-macos then does not run (its row reads UNKNOWN)
      # and rust-test-drift fails, while every job that needs only the archive still runs.
      - name: Linux listings for the macOS inventory
        id: listings
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tree
        run: |
          s=$(date +%s)
          pid="$(cat "$SC/early-bazel.pid")"
          while [ ! -e "$SC/early-state/bazel.rc" ] && kill -0 "$pid" 2>/dev/null; do sleep 5; done
          echo "waited $(($(date +%s) - s)) s for the Bazel half; its output:"
          cat "$SC/early-bazel.log"
          bash ../tool/.github/sami/rust-test-early-listings.sh archive "$SC/early-state" "$SC/build/binaries-metadata.json" "$CARGO_TARGET_DIR" "$SC/listings"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.listings.outcome == 'success' }}
        with:
          name: rust-test-early-listings
          path: ${{ github.workspace }}/sc/listings/
          # As long as GitHub lets a job be re-run: a re-run of rust_test reads them again.
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sc-build
          path: ${{ github.workspace }}/sc/build/
          retention-days: 14

  natives:
    # The host addon the TypeScript tests load, built as `bun run build:native` builds it.
    name: build the host addon
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'natives')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # What it built, for sami-rust-test.yml's check of the bytes it downloads.
    outputs:
      addon-file: ${{ steps.addon.outputs.file }}
      addon-sha256: ${{ steps.addon.outputs.sha256 }}
      addon-commit: ${{ steps.addon.outputs.commit }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-natives
      OMP_NATIVE_BUILD_BACKEND: cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: bun install
        working-directory: tree
        run: bun install --frozen-lockfile
      - name: Build the addon
        working-directory: tree
        run: |
          s=$(date +%s)
          bun run build:native
          echo "ADDON built in $(($(date +%s) - s)) s"
          ls -l packages/natives/native/*.node
      # The one addon's name, sha256 and commit; no output when there is not exactly one.
      - name: Hash the addon
        id: addon
        working-directory: tree
        run: |
          set -- packages/natives/native/*.node
          if [ "$#" != 1 ] || [ ! -f "$1" ]; then
            echo "::warning title=Addon::expected one addon, found: $*"
            exit 0
          fi
          {
            echo "file=$(basename "$1")"
            echo "sha256=$(sha256sum "$1" | cut -d ' ' -f 1)"
            echo "commit=$(git rev-parse HEAD)"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-natives
          path: ${{ github.workspace }}/tree/packages/natives/native/*.node
          # 30 days, as long as GitHub lets a job be re-run: a re-run of the failed Rust tests
          # (sami-rust-test.yml) downloads it again, and does not run this job again.
          retention-days: 30
          if-no-files-found: error

  set:
    name: pi-shell set ${{ matrix.who }} ${{ matrix.shard }}
    needs: [plan, tools, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'set') && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.set) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: stable
      SC_SET_SHARDS: ${{ needs.plan.outputs.set_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          # .github/sami for libtest-bound.py, which bounds each test of a binary set.sh runs.
          sparse-checkout: |
            .github/sami-checks
            .github/sami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-archive
          path: ${{ github.workspace }}/sc/archive
      - name: Host
        run: bash tool/.github/sami-checks/host.sh "$SC/tools/sc-tools.tgz"
      - name: Unpack the archive where it was built
        run: tar --zstd -xf "$SC/archive/tests.tar.zst" -C "$GITHUB_WORKSPACE" && du -sh "$CARGO_TARGET_DIR"
      - name: Tests
        run: bash tool/.github/sami-checks/set.sh "${{ matrix.who }}" "${{ matrix.shard }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != matrix.name }}
        with:
          name: sc-res-${{ matrix.name }}
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  builtins:
    name: pi-builtins ${{ matrix.who }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builtins) }}
    needs: [plan, tools, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'builtins') && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-archive
          path: ${{ github.workspace }}/sc/archive
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Host
        run: bash tool/.github/sami-checks/host.sh "$SC/tools/sc-tools.tgz"
      - name: Tests
        env:
          # check_folded_sources' tests run their host half where names fold (host.sh's /mnt/sc-fold).
          SC_FOLDED: 'test(/::a_source_whose_name_folds_to_the_backup_is_not_/)'
        run: bash tool/.github/sami-checks/nextest.sh builtins pi-builtins "${{ matrix.who }}" 'package(pi-builtins)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != matrix.name }}
        with:
          name: sc-res-${{ matrix.name }}
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  workspace:
    name: workspace ${{ matrix.who }} ${{ matrix.part }}
    needs: [plan, tools, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'workspace') && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.workspace) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-archive
          path: ${{ github.workspace }}/sc/archive
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Host
        run: bash tool/.github/sami-checks/host.sh "$SC/tools/sc-tools.tgz"
      - name: Tests
        run: |
          bash tool/.github/sami-checks/nextest.sh workspace "part ${{ matrix.part }}/${{ needs.plan.outputs.workspace_parts }}" "${{ matrix.who }}" \
            'not (package(pi-shell) | package(pi-builtins))' "count:${{ matrix.part }}/${{ needs.plan.outputs.workspace_parts }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

      - name: Tests
        run: bash tool/.github/sami-checks/ts.sh small
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'ts-small' }}
        with:
          name: sc-res-ts-small
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  ts-ca:
    name: coding-agent ${{ matrix.shard }}
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'ts-ca') && needs.natives.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SC_CA_SHARDS: ${{ needs.plan.outputs.ca_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: bun install
        working-directory: tree
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-natives
          path: ${{ github.workspace }}/tree/packages/natives/native
      - name: The only addon a workspace load reads
        run: bash tool/.github/sami-checks/bun.sh addon
      - name: The Chrome the tree's puppeteer-core pins
        run: bash tool/.github/sami-checks/bun.sh chrome
      - name: Tests
        run: bash tool/.github/sami-checks/ts.sh ca "${{ matrix.shard }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != matrix.name }}
        with:
          name: sc-res-${{ matrix.name }}
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  checkts:
    name: check:ts
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'checkts')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: bun install
        working-directory: tree
        run: bun install --frozen-lockfile
      - name: check:ts
        run: bash tool/.github/sami-checks/ts.sh checkts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'checkts' }}
        with:
          name: sc-res-checkts
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  seed-linux:
    # The Linux Rust gate's build seed: this commit's own //crates/... built here into an unbounded
    # Bazel disk cache, packed with the repository cache and uploaded as the artifact sc-seed-linux,
    # kept 3 days (.github/sami/gate-seed.sh build). No test and no root setup runs here: this is
    # the build code sami-build.yml's release_binary already builds and trusts, and the job holds no
    # cache token (the workflow's cache-mode none), so nothing it writes can reach release_binary.
    # It runs on the cut and on a dispatch with seed=build; a proof with seed=auto reads the newest
    # cut's seed instead and needs no job here.
    name: build seed (Linux)
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'seed-linux') && needs.plan.outputs.seed == 'build' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # The archive's sha256, which every reader checks the bytes it downloads against.
    outputs:
      sha256: ${{ steps.seed.outputs.sha256 }}
    steps:
      # The seed is about 7.6 GiB unpacked and 2.3 GB packed, and the image leaves about 25 GB.
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami
            .github/actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - id: bazel
        uses: ./tool/.github/actions/bazel-cache
      - name: Build the seed
        id: seed
        working-directory: tree
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
          SEED_ARCHIVE: ${{ runner.temp }}/sc-seed.tar.zst
        run: bash ../tool/.github/sami/gate-seed.sh build //crates/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-seed-linux
          path: ${{ runner.temp }}/sc-seed.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  seed-macos:
    # The macOS gate's build seed, as seed-linux: the test targets this commit builds on macos-15,
    # which is what rust_test_macos's inventory builds (--build_tests_only), as sc-seed-macos.
    name: build seed (macOS)
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'seed-macos') && needs.plan.outputs.seed == 'build' }}
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      sha256: ${{ steps.seed.outputs.sha256 }}
    steps:
      - name: Disk space
        run: df -h "$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami
            .github/actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - id: bazel
        uses: ./tool/.github/actions/bazel-cache
      - name: Build the seed
        id: seed
        working-directory: tree
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
          SEED_ARCHIVE: ${{ runner.temp }}/sc-seed.tar.zst
        run: bash ../tool/.github/sami/gate-seed.sh build --build_tests_only //crates/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-seed-macos
          path: ${{ runner.temp }}/sc-seed.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  rust-test:
    # sami-rust-test.yml's rust_test (job: linux): the Rust tests under Bazel and the other cargo
    # workspaces, with the addon the natives job built. The summary reads no unit of theirs: it has
    # a row for each of that workflow's two jobs, from the job's result. It runs whatever the
    # natives job's verdict, and fails by name without its addon. rust-test-drift compares its
    # Bazel listings with the build job's early ones, which rust-test-macos's inventory read.
    name: rust tests
    needs: [plan, natives, seed-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'rust-test') }}
    # actions: read downloads the seed artifact and reads the seed job's log line (the called
    # workflow's jobs ask for it); the repository is public, so it reads nothing private.
    permissions:
      contents: read
      actions: read
    cache-mode: none
    uses: ./.github/workflows/sami-rust-test.yml
    with:
      job: linux
      commit: ${{ needs.plan.outputs.commit }}
      seed: ${{ needs.plan.outputs.seed }}
      seed-sha256: ${{ needs.seed-linux.outputs.sha256 }}
      addon-file: ${{ needs.natives.outputs.addon-file }}
      addon-sha256: ${{ needs.natives.outputs.addon-sha256 }}
      addon-commit: ${{ needs.natives.outputs.addon-commit }}

  rust-test-macos:
    # sami-rust-test.yml's rust_test_macos (job: macos): the tests only macOS can run, found by
    # comparing each macOS test binary with the Linux listing of its target. Those listings are
    # the build job's (rust-test-early-listings.sh), so it starts when that job ends, not when
    # rust_test's Bazel build does (run 45516812533 waited 71 min for it). It runs only when the
    # build job's listing step passed.
    name: rust tests macOS
    needs: [plan, build, seed-macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'rust-test-macos') && needs.build.outputs.listings == 'success' }}
    # actions: read downloads the seed artifact and reads the seed job's log line (the called
    # workflow's jobs ask for it); the repository is public, so it reads nothing private.
    permissions:
      contents: read
      actions: read
    cache-mode: none
    uses: ./.github/workflows/sami-rust-test.yml
    with:
      job: macos
      commit: ${{ needs.plan.outputs.commit }}
      seed: ${{ needs.plan.outputs.seed }}
      seed-sha256: ${{ needs.seed-macos.outputs.sha256 }}

  rust-test-drift:
    # rust_test's Bazel listings (artifact rust-test-listings) against the early ones the build job
    # wrote and rust-test-macos's inventory read (rust-test-early-listings), as soon as rust_test
    # ends (.github/sami/rust-test-listings-drift.sh). A job of its own, since a job can count on
    # an artifact only of a job it needs, and rust_test does not need the build job: it starts when
    # the natives job ends. A test or a target listed on one side only is an error naming it, and a
    # missing artifact or listing is UNKNOWN; either fails this job, and the summary then reads
    # rust_test's row as failed, since that run's macOS inventory came from a wrong listing.
    name: rust test listings, early against Bazel's
    needs: [plan, build, rust-test]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'rust-test-drift') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami
      # A missing artifact is the drift check's UNKNOWN, by name, not a download error.
      - name: The early listings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-early-listings
          path: ${{ github.workspace }}/sc/early-listings
      - name: rust_test's listings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-listings
          path: ${{ github.workspace }}/sc/bazel-listings
      - name: The early listings against rust_test's
        run: bash tool/.github/sami/rust-test-listings-drift.sh "$SC/early-listings" "$SC/bazel-listings"

  rust-test-cold:
    # The seed's control: the Linux Rust gate again on the same commit with no seed, so that
    # rust-test-compare can hold the seeded run's per-test results against a cold run's. It runs on
    # every fifth cut and on any dispatch with seed=build (the plan's seed_control), and needs no
    # seed job: it starts when the natives job ends, beside the seeded call.
    name: rust tests, the cold control
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'rust-test-cold') && needs.plan.outputs.seed_control == 'true' }}
    # The most the called workflow may ask, which GitHub checks before the run starts even for a
    # job that never runs: its two jobs ask for actions: read, and this call builds cold.
    permissions:
      contents: read
      actions: read
    cache-mode: none
    uses: ./.github/workflows/sami-rust-test.yml
    with:
      job: linux
      commit: ${{ needs.plan.outputs.commit }}
      seed: "off"
      control: true
      addon-file: ${{ needs.natives.outputs.addon-file }}
      addon-sha256: ${{ needs.natives.outputs.addon-sha256 }}
      addon-commit: ${{ needs.natives.outputs.addon-commit }}

  rust-test-compare:
    # The seeded run's per-test results against the cold control's: the same tests with the same
    # status, test by test (.github/sami/rust-test-results-compare.sh). A test of a target listed
    # `flaky: ` in rust-test-known-failures.txt is compared by its final status, since Bazel runs
    # such a target again after a failed attempt. A difference, a missing results file or an empty
    # one fails this job, and the summary then reads the rust_test row failed: a seed that changes
    # what the gate reports is a seed nothing may trust.
    name: rust test results, seeded against cold
    needs: [plan, rust-test, rust-test-cold]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'rust-test-compare') && needs.plan.outputs.seed_control == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami
      # A missing artifact is the comparison's UNKNOWN, by name, not a download error.
      - name: The seeded run's results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-results-linux
          path: ${{ github.workspace }}/sc/seeded
      - name: The cold control's results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-results-linux-cold
          path: ${{ github.workspace }}/sc/cold
      # The two jobs' own verdicts, before their tests: a seeded job that passed beside a cold job
      # that failed is the seed changing what the gate reports, whatever the per-test results say,
      # and a control that did not finish checked nothing.
      - name: The seeded job's verdict against the cold one's
        env:
          SEEDED: ${{ needs.rust-test.result }}
          COLD: ${{ needs.rust-test-cold.result }}
        run: |
          echo "the seeded Linux gate: $SEEDED; the cold control: $COLD"
          case "$COLD" in
          success | failure) ;;
          *)
            echo "::error title=Rust test results::UNKNOWN: the cold control is [$COLD], so it compared nothing"
            exit 1
            ;;
          esac
          if [ "$SEEDED" != "$COLD" ]; then
            echo "::error title=Rust test results::the seeded Linux gate is [$SEEDED] and the cold one [$COLD] on this commit: the seed changed what the gate reports"
            exit 1
          fi
      - name: The seeded results against the cold ones
        run: bash tool/.github/sami/rust-test-results-compare.sh "$SC/cold" "$SC/seeded" tool/.github/sami/rust-test-known-failures.txt

  platforms:
    # macOS and Windows: the fork's platform checks, called on the candidate. Its report job's
    # pc-report is what the summary reads.
    name: platforms
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'platforms')
    # The most the called workflow may ask. GitHub checks each called job's permissions against
    # these before the run starts, whether or not the job runs, and platform-checks.yml's
    # cache-prune job asks for actions: write. That job runs only on a dispatch of
    # platform-checks.yml itself, so in this workflow no job holds actions: write; every other
    # called job asks only for contents: read.
    permissions:
      actions: write
      contents: read
    # No cache-mode here: the workflow's none is the called workflows' limit, so their builds
    # restore and save nothing (platform-checks declares read or write nowhere a call reaches).
    uses: ./.github/workflows/platform-checks.yml
    with:
      head: ${{ needs.plan.outputs.commit }}
      platforms: ${{ needs.plan.outputs.platforms }}
      crates: ${{ needs.plan.outputs.platform_crates }}
      partitions: ${{ needs.plan.outputs.platform_partitions }}
      retries: ${{ needs.plan.outputs.platform_retries }}
      # The control `silent=macos-bash`: the macOS legs skip the Homebrew bash install, and their
      # check stops them, so the macOS row must read UNKNOWN.
      skip_bash_install: ${{ needs.plan.outputs.silent == 'macos-bash' }}

  clippy:
    name: clippy
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'clippy')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Clippy compiles the candidate's crates, their tests and their dependencies cold, as the build
    # job does: no cache (the workflow's cache-mode none).
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-clippy
      SC_CLIPPY_CRATES: ${{ needs.plan.outputs.clippy_crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile, clippy)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal -c clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: Clippy, then its control
        run: bash tool/.github/sami-checks/clippy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'clippy' }}
        with:
          name: sc-res-clippy
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  gvisor:
    name: gVisor
    needs: [plan, tools, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'gvisor') && needs.build.result == 'success' }}
    uses: ./.github/workflows/sami-checks-gvisor.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      silent: ${{ needs.plan.outputs.silent }}
      matrix: ${{ needs.plan.outputs.gvisor }}
      set_shards: ${{ needs.plan.outputs.gv_set_shards }}

  summary:
    name: summary
    # rust-test, rust-test-macos and rust-test-drift are here so that the summary runs last and
    # reads their results (SC_RUST_TESTS).
    needs: [plan, tools, build, natives, set, builtins, workspace, ts-small, ts-ca, checkts, skip-forms,
            platforms, clippy, gvisor, docs, changelog, rustfmt, membench, builtins-lint, bazel-lock, seed-linux, seed-macos,
            rust-test, rust-test-macos, rust-test-drift, rust-test-cold, rust-test-compare]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions: read lists this workflow's runs and downloads the previous cut's sc-report (the step
    # "The previous cut's report"); the repository is public, so it reads nothing private.
    permissions:
      contents: read
      actions: read
    # The step summary's verdict line as one JSON object (sc.py cmd_summary: verdict, subset, rows_run,
    # rows_not_run, rows, plant, plant_caught, and first seen at this cut: first_seen, first_seen_against,
    # first_seen_why, first_seen_not_compared, plant_first_seen); empty when the summary wrote none.
    outputs:
      verdict: ${{ steps.summary.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          # .github/sami: the rustfmt row's units are the workspaces its rust-test-cargo-workspaces.txt lists.
          sparse-checkout: |
            .github/sami-checks
            .github/sami
      # Each artifact lands in a folder of its own name (no merge), so no job's files replace another's.
      - name: Results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sc-res-*
          path: ${{ github.workspace }}/sc/results
      # The build record and the platform artifacts exist only when their job ran.
      - name: Build record
        if: contains(fromJSON(needs.plan.outputs.jobs), 'build')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-build
          path: ${{ github.workspace }}/sc/build
      # The platform checks' report, each leg's record and JUnit report (for its times), and each
      # build's record and log (an UNKNOWN names a failed build's first compiler error).
      - name: Platform report
        if: contains(fromJSON(needs.plan.outputs.jobs), 'platforms')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pc-report
          path: ${{ github.workspace }}/sc/pc
      - name: Platform legs
        if: contains(fromJSON(needs.plan.outputs.jobs), 'platforms')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pc-results-*
          merge-multiple: true
          path: ${{ github.workspace }}/sc/pc
      - name: Platform builds
        if: contains(fromJSON(needs.plan.outputs.jobs), 'platforms')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pc-build-*
          merge-multiple: true
          path: ${{ github.workspace }}/sc/pc
      # The report the summary compares this run's failures with (first seen at this cut): the
      # sc-report of the run the dispatch input `previous` names, else of the newest completed run on
      # a push of release-candidate before this one, of another commit. sc.py previous-report puts its
      # results.json and verdict.json in $SC/previous beside about.json, which names the run or says
      # why none could be read; the summary then reads first seen UNKNOWN, and so it does when this
      # step fails before it writes about.json.
      - name: The previous cut's report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SC_COMMIT: ${{ needs.plan.outputs.commit }}
          SC_INPUT_PREVIOUS: ${{ inputs.previous }}
        run: python3 tool/.github/sami-checks/sc.py previous-report "$SC/previous"
      - name: Summary
        id: summary
        env:
          SC_COMMIT: ${{ needs.plan.outputs.commit }}
          SC_ROWS: ${{ needs.plan.outputs.rows }}
          SC_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          # rust_test's row is rust_test's result while rust-test-drift passed; a drift (or a
          # listing missing) reads failure, and a drift check that did not run, its result
          # (skipped or cancelled: UNKNOWN, or NOT RUN when the run did not plan the row). On a run
          # that plans the seed's cold control, rust-test-compare is read first and the same way: a
          # failure (the two runs of this commit disagree, by verdict or test by test) fails the
          # row, and a control that did not finish is UNKNOWN, since it checked nothing.
          SC_RUST_TESTS: "rust_test=${{ needs.plan.outputs.seed_control == 'true' && needs.rust-test-compare.result != 'success' && (needs.rust-test-compare.result == 'failure' && 'failure' || needs.rust-test-compare.result) || (needs.rust-test-drift.result != 'success' && (needs.rust-test-drift.result == 'failure' && 'failure' || needs.rust-test-drift.result) || needs.rust-test.outputs.rust-test) }} rust_test_macos=${{ needs.rust-test-macos.outputs.rust-test-macos }}"
          SC_SILENT: ${{ needs.plan.outputs.silent }}
          SC_PLANT: ${{ needs.plan.outputs.plant }}
          SC_VERDICT: ${{ github.workspace }}/sc/report/verdict.json
          SC_PREVIOUS: ${{ github.workspace }}/sc/previous
        run: |
          mkdir -p "$SC/report" "$SC/results/sc-skip-lines" "$SC/build" "$SC/pc"
          # The control `silent=platforms`: the platform results are not read, so both rows must be UNKNOWN.
          # A run whose rows are neither platform's has no platform report to read.
          if [ -n "$SC_PLATFORMS" ] && [ "$SC_SILENT" != platforms ]; then
            python3 tool/.github/sami-checks/sc.py platforms "$SC/pc" "$SC/results/sc-res-platforms" ||
              echo "::error::the platform report reader failed, so the platform rows read UNKNOWN"
          fi
          rc=0
          # The run-time half of skip-forms, a unit of its row: a result the summary reads like any other
          # (no file, as when this command fails, reads UNKNOWN).
          python3 tool/.github/sami-checks/sc.py skip-lines "$SC/results" tool/.github/sami-checks/skip-forms-not-markers.txt \
            > "$SC/results/sc-skip-lines/skip-lines.json" || echo "::error title=skip-lines::sc.py skip-lines failed; its unit reads UNKNOWN"
          python3 tool/.github/sami-checks/sc.py summary "$SC/results" "$SC/build" tool/.github/sami-checks/known-failures.txt > "$SC/report/summary.md" || rc=$?
          # From here the step ends with the summary's own exit (0 PASS, 1 FAIL, 2 UNKNOWN). A command
          # below that fails is named and keeps a fault at 1; a pass it leaves unwritten is no pass, so
          # the verdict file and summary.md then read UNKNOWN (sc.py unreadable-pass) and the step ends
          # 2. Under bash -e an unguarded command would end the step 1 instead. results.json is written
          # first and the job's output last, so each report written after a failure reads UNKNOWN.
          summarised=
          unwritten() {
            if [ "$rc" = 1 ]; then
              echo "::error title=sami-checks summary::$1"
              return 0
            fi
            echo "::error title=sami-checks summary::UNKNOWN: $1, so the summary exits 2"
            [ "$rc" = 0 ] || return 0
            rc=2
            line="$(python3 tool/.github/sami-checks/sc.py unreadable-pass "$SC/report/summary.md" "$SC_VERDICT" "$1")" || return 0
            [ -z "$summarised" ] || printf '\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY" || true
          }
          python3 -c 'import json,os,sys; sys.path.insert(0, "tool/.github/sami-checks"); import sc; json.dump(sc.load_results(sys.argv[1]), open(sys.argv[2], "w"))' "$SC/results" "$SC/report/results.json" ||
            unwritten "the units' results could not be written to sc-report's results.json"
          if cat "$SC/report/summary.md" >> "$GITHUB_STEP_SUMMARY"; then
            summarised=1
          else
            unwritten "the summary could not be added to the step summary"
          fi
          if [ -s "$SC_VERDICT" ]; then
            echo "verdict=$(cat "$SC_VERDICT")" >> "$GITHUB_OUTPUT" || unwritten "the verdict could not be set as the job's output"
            echo "::notice title=sami-checks verdict::$(cat "$SC_VERDICT")"
          else
            echo "::error title=sami-checks verdict::the summary wrote no verdict"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sc-report
          path: ${{ github.workspace }}/sc/report/
          retention-days: 30

  skip-forms:
    # Every print of the tree that says skip, not run, gave up or nothing checked is read by sc.py's
    # SKIP_MARKER or named in skip-forms-not-markers.txt; a new form fails this job and its row.
    name: skip prints the summary reads
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'skip-forms')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          sparse-checkout: crates
      - name: Scan
        run: |
          mkdir -p "$SC/res"
          python3 tool/.github/sami-checks/sc.py skip-forms tree tool/.github/sami-checks/skip-forms-not-markers.txt > "$SC/res/skip-forms.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r["status"], r["note"]); [print(f) for f in r["failures"]]; sys.exit(r["status"] != "PASS")' "$SC/res/skip-forms.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'skip-forms' }}
        with:
          name: sc-res-skip-forms
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  docs:
    # rustdoc's broken intra-doc links in pi-shell (docs.sh), on the tree's toolchain, built cold.
    name: rustdoc intra-doc links
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: cargo doc -p pi-shell
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/docs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'docs' }}
        with:
          name: sc-res-docs
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  changelog:
    # fix-changelogs.ts --check (changelog.sh). The tool reads its baseline from the latest v* tag
    # and its archive links from the history, so this checkout has both.
    name: CHANGELOG format
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'changelog')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: bun install
        working-directory: tree
        run: bun install --frozen-lockfile
      - name: fix-changelogs --check
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/changelog.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'changelog' }}
        with:
          name: sc-res-changelog
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  rustfmt:
    # cargo fmt --check in each cargo workspace the gate builds (rustfmt.sh), on the tree's toolchain,
    # and, for a workspace with places, again at the tree's upstream base (the merge base with
    # upstream's main, which rustfmt.sh fetches), so that upstream's own places read KNOWN. The
    # checkout holds the fork's whole history without blobs, for that merge base. A formatter only:
    # no build and no code of the tree runs, so it needs no cache.
    name: rustfmt
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'rustfmt')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami-checks
            .github/sami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile, rustfmt)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal -c rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: cargo fmt --check, each workspace
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/rustfmt.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'rustfmt' }}
        with:
          name: sc-res-rustfmt
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  membench:
    # pi-shell's memory bench (membench.sh): built by `cargo bench --no-run` (cargo's bench profile,
    # which inherits the tree's release profile) on the tree's toolchain, cold like every job that
    # builds code of the tree (the workflow's cache-mode none), then run once, as cargo runs it.
    name: pi-shell memory bench
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'membench')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: cargo bench -p pi-shell --bench memory, built and run once
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/membench.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'membench' }}
        with:
          name: sc-res-membench
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  builtins-lint:
    # pi-builtins under clippy and cargo fmt --check with the crate's opt-outs lifted in this checkout
    # (builtins-lint.sh), on the tree's toolchain, cold like every job that builds code of the tree
    # (the workflow's cache-mode none), and, for a crate with findings, again at the tree's upstream
    # base (the merge base with upstream's main, which upstream-base.sh fetches), so that upstream's
    # own findings read KNOWN. The checkout holds the fork's whole history without blobs, for that
    # merge base.
    name: pi-builtins lint
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'builtins-lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile, clippy and rustfmt)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal -c clippy -c rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: clippy and cargo fmt --check of pi-builtins, its opt-outs lifted
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/builtins-lint.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'builtins-lint' }}
        with:
          name: sc-res-builtins-lint
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

  bazel-lock:
    # gen-bazel-lock --check (bazel-lock.sh): no build, no cargo cache, only Bazel's module resolution
    # and its reading of the lock. The tool's checkout holds .github/sami too, for the runner whose
    # fixed environment sami-build.yml's bazel_lock regenerates the lock in.
    name: MODULE.bazel.lock
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'bazel-lock')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami-checks
            .github/sami
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: gen-bazel-lock --check
        env:
          SC_PLANT: ${{ needs.plan.outputs.plant }}
        run: bash tool/.github/sami-checks/bazel-lock.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.plan.outputs.silent != 'bazel-lock' }}
        with:
          name: sc-res-bazel-lock
          path: ${{ github.workspace }}/sc/res/
          retention-days: 14

    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs), 'ts-small') && needs.natives.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: bun 1.4.5
        run: bash tool/.github/sami-checks/bun.sh
      - name: bun install
        working-directory: tree
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-natives
          path: ${{ github.workspace }}/tree/packages/natives/native
      - name: The only addon a workspace load reads
        run: bash tool/.github/sami-checks/bun.sh addon
      - name: The Chrome the tree's puppeteer-core pins
        run: bash tool/.github/sami-checks/bun.sh chrome
      - name: WebMCP probe (the runner's Chrome and the pinned one; a diagnostic)

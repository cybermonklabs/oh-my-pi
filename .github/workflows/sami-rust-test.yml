# The Rust tests of a release candidate, report only. sami-checks.yml calls this workflow twice on
# each push of release-candidate and on its dispatch, once for each job (input `job`): rust_test
# (linux) runs `bazel test //crates/...` and the repository's other cargo workspaces against the
# known-failure gate (.github/sami/rust-test.sh); rust_test_macos (macos) runs the tests only
# macOS can run. These were sami-build.yml's rust_test and rust_test_macos jobs, where a red one
# held the release. Here a red one holds nothing: publish reads only sami-build.yml's run, and a
# red test is fixed forward. sami-checks.yml's summary has a row for each job, read from the
# job's result (this workflow's outputs).
#
# rust_test_macos reads the Linux listing of each rust_test target from the artifact
# rust-test-early-listings, which sami-checks.yml's build job writes from its cargo test binaries
# (.github/sami/rust-test-early-listings.sh), so it starts when that job ends, not after
# rust_test. sami-checks.yml's rust-test-drift job compares them with rust_test's own Bazel
# listings (artifact rust-test-listings) as soon as rust_test ends
# (.github/sami/rust-test-listings-drift.sh), and any difference fails rust_test's row.
#
# The tree under test is inputs.commit, checked out at tree/. The gate's scripts and lists
# (.github/sami) and the actions these jobs use (.github/actions) come from the commit this run
# was started from, checked out at tool/. The gate's are copied over the tree's .github/sami,
# since its scripts read their lists at .github/sami in the directory they run in. On a push of
# release-candidate both are the same commit; a dispatch of an older commit (one from before this
# gate, for example) is judged by the lists at the dispatched ref. tool/ also holds
# .github/workflows and .github/sami-checks, which the gate's regression tests read (cache_lint,
# and the candidate branch every one of those files names), and .config, whose nextest.toml gives
# libtest-bound.py its bounds in those tests.
#
# Caches: cache-mode is none here and on the calling job. Test code runs here with the runner's
# passwordless sudo and can read the job's token; with cache-mode none that token can neither
# restore nor save a GitHub Actions cache entry, so it cannot write one that sami-build.yml's
# release_binary restores on the same push. Harness cases W6 to W8, W12, W23 to W25, W30, W34,
# W36, W46, W68 and W69 (.github/sami/tests/run.sh) keep it so.
#
# The build seed is how these jobs are faster without a cache: an artifact a seed job of
# sami-checks.yml built from the commit under test, with no test and no root setup, holding the
# Bazel disk and repository caches of that build. These jobs download it, check it against the
# sha256 its seed job published, and unpack it into the disk cache
# (.github/sami/gate-seed.sh, which writes one GATESEED path=seeded|cold line and builds cold on
# any doubt). It is never a GitHub Actions cache entry, so no token here can write anything
# release_binary restores; `actions: read` is all the jobs hold, and the repository is public.
name: sami rust tests

on:
  workflow_call:
    inputs:
      # Which job this call runs: linux (rust_test) or macos (rust_test_macos).
      job:
        description: "linux (rust_test) or macos (rust_test_macos)"
        required: true
        type: string
      commit:
        description: "Commit to test: a full 40-character id"
        required: true
        type: string
      # The addon the omp-rpc smoke tests' server loads: what sami-checks.yml's natives job
      # says it built (its file name, its sha256 and the commit it built). Empty when that job
      # built none.
      addon-file:
        required: false
        default: ""
        type: string
      addon-sha256:
        required: false
        default: ""
        type: string
      addon-commit:
        required: false
        default: ""
        type: string
      # The build seed the Bazel builds start from (.github/sami/gate-seed.sh):
      # `auto` reads the newest cut's, `build` reads the one the calling run's
      # own seed job built and names its sha256 in seed-sha256, and `off`
      # builds cold. A miss or a sha256 that differs builds cold too.
      seed:
        description: "The build seed: auto (the newest cut's), build (the calling run's own) or off"
        required: false
        default: "off"
        type: string
      seed-sha256:
        description: "With seed=build: the sha256 the calling run's seed job gave"
        required: false
        default: ""
        type: string
      # The seed's cold control calls this workflow a second time in one run,
      # on the same job, so every artifact it uploads is named apart: two jobs
      # that upload one name make one of them fail, and the drift check must
      # read the listings of the run under test, not the control's.
      control:
        description: "This call is the seed's cold control, and its artifacts carry -cold"
        required: false
        default: false
        type: boolean
    # Each job's result (success, failure, cancelled or skipped), for sami-checks' summary rows.
    outputs:
      rust-test:
        description: "rust_test's result"
        value: ${{ jobs.rust_test.result }}
      rust-test-macos:
        description: "rust_test_macos's result"
        value: ${{ jobs.rust_test_macos.result }}

permissions:
  contents: read

cache-mode: none

# Each job checks the tree out at tree/, and its run steps start there.
defaults:
  run:
    working-directory: tree

jobs:
  rust_test:
    # Upstream runs these tests in ci.yml's rust_validate job, on upstream's
    # self-hosted vmon runners, which the fork has no access to; so every fork
    # run of it is cancelled and no sami release ran a Rust test. This job runs
    # the same `bazel test //crates/...` on a GitHub-hosted runner, uncached,
    # and reports: it holds no release.
    # The omp-rpc smoke tests' server loads the linux-x64-modern native addon
    # that sami-checks.yml's natives job built from the same commit, so the
    # job that calls this workflow starts when that job ends, and a run
    # without that addon fails here.
    # The parity step fails while a test target of the repository's own Rust
    # suite has no Bazel test target. The test step, .github/sami/rust-test.sh,
    # fails when a test fails that .github/sami/rust-test-known-failures.txt
    # does not name (or a named one passes), when a target fails to build or
    # has no result, when a test of a binary runs in no invocation, when an
    # #[ignore]d test runs nowhere (each is run alone, as root where it needs
    # root, or is a child entry point, or runs in rust_test_macos), and when a
    # test skips itself. It sees a skip in what a passing test prints: the
    # marker `skipped: <reason>` or a word the tree's tests used before it
    # (`skipping`, `SKIP`, `not run`, `UNCOMPARED`) is a skip, and any other
    # output fails unless .github/sami/rust-test-known-output.txt names the
    # test. A line a test's child or thread writes outside libtest's record
    # fails unless .github/sami/rust-test-known-raw-output.txt names it. The
    # sticky-directory FIFO tests run alone out of the sandbox, as the
    # runner's user given the FIFO the precondition step makes, and as root.
    # A test that returns early and prints nothing passes: no log shows it,
    # so each test that can skip prints the marker before it returns.
    name: Rust tests (bazel)
    if: inputs.job == 'linux'
    runs-on: ubuntu-22.04
    # Uncached, the build and the tests took 17 to 25 minutes (runs
    # 44696018007, 44841451861), and run 44879022489's 35 with the #[ignore]d
    # tests that run alone (each bounded at 1200 s); the cargo doctests and
    # the omp-rpc smoke tests come on top.
    timeout-minutes: 150
    # Test code and dev-dependency build scripts run here, so the job gets a
    # read-only token, and checkout keeps no credential in .git/config.
    # actions: read downloads the seed artifact of this run or of the newest
    # cut's, and reads that run's seed job log for its sha256; the repository
    # is public, so it reads nothing private. It grants no write of any kind.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the gate's scripts and actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami
            .github/sami-checks
            .github/actions
            .github/workflows
            .config
      - name: Check out the tree under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tree
          ref: ${{ inputs.commit }}
          persist-credentials: false
      # See the header: the scripts read their lists at .github/sami.
      - name: The gate's scripts and lists in the tree
        run: |
          rm -rf .github/sami
          cp -R ../tool/.github/sami .github/sami
          echo "the tree's .github/sami against the gate's ($(git -C ../tool rev-parse HEAD)):"
          git status --short -- .github/sami
      # The omp-rpc smoke tests' server loads packages/natives/native's
      # pi_natives.linux-x64-modern.node: the one sami-checks.yml's natives job
      # built from this commit in this run, a cargo build for its host
      # (`bun run build:native` with OMP_NATIVE_BUILD_BACKEND=cargo). It is
      # not the released addon, which release_binary builds with Bazel and
      # its own smoke test loads. Nothing here builds it again: a missing
      # artifact fails the download, and the next step fails when the natives
      # job names another commit or file, or the bytes' sha256 differs from
      # the one that job gave. They run first, so a run without the addon
      # fails in a minute. sami-checks.yml keeps the artifact 30 days, so
      # this job can be re-run alone.
      - name: Download the addon the natives job built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-natives
          path: ${{ runner.temp }}/natives/natives-linux-x64-modern
      - name: Check the addon the natives job built
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          GOT_COMMIT: ${{ inputs.addon-commit }}
          GOT_FILE: ${{ inputs.addon-file }}
          WANT_SHA256: ${{ inputs.addon-sha256 }}
        run: |
          fail() { echo "::error title=Native addon::$1"; exit 1; }
          # The loader takes the modern addon only where /proc/cpuinfo names
          # avx2 (detectAvx2Support, packages/natives/native/loader-state.js);
          # elsewhere it looks for a baseline addon, which this job has not.
          grep -qiw avx2 /proc/cpuinfo ||
            fail "this runner's CPU has no AVX2, so the loader would not load the linux-x64-modern addon, and the job has no baseline addon"
          file=pi_natives.linux-x64-modern.node
          dir="$RUNNER_TEMP/natives/natives-linux-x64-modern"
          ls -l "$dir"
          [ -f "$dir/$file" ] || fail "the sc-natives artifact holds no $file"
          [ -n "$WANT_SHA256" ] || fail "the natives job gave no addon-sha256 output"
          [ "$GOT_COMMIT" = "$COMMIT" ] ||
            fail "the natives job built [$GOT_COMMIT], not this run's $COMMIT"
          [ "$GOT_FILE" = "$file" ] ||
            fail "the natives job built [$GOT_FILE], not $file"
          got="$(sha256sum "$dir/$file" | cut -d ' ' -f 1)"
          [ "$got" = "$WANT_SHA256" ] ||
            fail "$file has sha256 $got; the natives job gives $WANT_SHA256"
          echo "$file: sha256 $got, built from $COMMIT by the natives job"
      # The test step's decisions, the download helper and the parity
      # script's argument checks, against stubs; a minute, before the build.
      # It runs the gate's copy in tool/, whose harness also lints
      # sami-build.yml and this file at that commit.
      - name: The gate's own regression tests
        shell: bash
        run: bash ../tool/.github/sami/tests/run.sh
      - id: bazel
        uses: ./tool/.github/actions/bazel-cache
      # The build seed (.github/sami/gate-seed.sh): the Bazel disk cache a seed
      # job built from this commit's own build code, with no test and no root
      # setup, in this run (seed=build, the sha256 that job gave as its output)
      # or in the newest cut's run (seed=auto, the sha256 that job wrote in its
      # own log). The pick step names the run to take it from, the download
      # step brings the artifact, and the use step checks the bytes against
      # that sha256 and unpacks them, or leaves this job to build cold; its
      # GATESEED path= line says which. No GitHub Actions cache is touched
      # either way, and every test runs whatever the cache holds
      # (test --cache_test_results=no).
      - name: Which seed this job reads
        id: seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_MODE: ${{ inputs.seed }}
          SEED_SHA256: ${{ inputs.seed-sha256 }}
          SEED_NAME: sc-seed-linux
          SEED_JOB: build seed (Linux)
        run: bash ../tool/.github/sami/gate-seed.sh pick
      # The seed of this run is this run's artifact, and the cut's is another
      # run's: that one needs the run's id and a token, and this one must not
      # name them (download-artifact takes the current run when it is given
      # neither). A download that fails leaves the job to build cold.
      - name: Download this run's own seed
        if: ${{ steps.seed.outputs.run-id == github.run_id }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sc-seed-linux
          path: ${{ runner.temp }}/gate-seed
      - name: Download the cut's seed
        if: ${{ steps.seed.outputs.run-id != '' && steps.seed.outputs.run-id != github.run_id }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sc-seed-linux
          run-id: ${{ steps.seed.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate-seed
      - name: Point Bazel at the seed
        shell: bash
        env:
          RC: ${{ steps.bazel.outputs.rc }}
          SEED_ARCHIVE: ${{ runner.temp }}/gate-seed/sc-seed.tar.zst
          SEED_SHA256: ${{ steps.seed.outputs.sha256 }}
          SEED_REASON: ${{ steps.seed.outputs.reason }}
          SEED_RUN_ID: ${{ steps.seed.outputs.run-id }}
        run: bash ../tool/.github/sami/gate-seed.sh use
      # The reference rsync, zsh and bash below are built from pinned
      # tarballs on every run, never restored from a GitHub Actions cache: the
      # tests run in this job, on a runner whose user has passwordless sudo,
      # and code they run could save a cache entry for this ref (one no run
      # has written yet, such as the next runner image's) that a later run
      # would restore and judge the tests with. The three builds take about
      # 2 min 15 s (run 44987520746). A harness case (W6) keeps the gate's
      # jobs off the cache.
      # pi-builtins' rsync conformance and daemon tests compare the builtin
      # byte for byte with rsync 3.5.1 built with every checksum and
      # compressor the builtin offers, and skip without one; the runner's
      # rsync is 3.2.7, so they ran nowhere. The test step puts this build
      # first on the tests' PATH and sets RSYNC_REFERENCE_REQUIRED, with which
      # a missing or incomplete reference fails them instead.
      # The -dev packages are needed only to build; the built binary's shared
      # libraries are on the image (the check step proves it loads).
      - name: Libraries of the reference rsync
        run: |
          sudo apt-get -q -o Acquire::Retries=5 update
          sudo apt-get -q -o Acquire::Retries=5 install -y --no-install-recommends libxxhash-dev liblz4-dev libzstd-dev libacl1-dev libidn2-dev
      - name: Build the reference rsync 3.5.1
        shell: bash
        run: |
          # download.samba.org has timed out or answered 504 for hours at a
          # time (2026-11-20), so the UK mirror of rsync.samba.org comes first.
          bash .github/sami/fetch-verified.sh "Reference rsync" "$RUNNER_TEMP/rsync-3.5.1.tar.gz" \
            c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef \
            https://www.mirrorservice.org/sites/rsync.samba.org/src/rsync-3.5.1.tar.gz \
            https://download.samba.org/pub/rsync/src/rsync-3.5.1.tar.gz
          mkdir -p "$RUNNER_TEMP/rsync-build" "$HOME/rsync-ref/bin"
          tar -xzf "$RUNNER_TEMP/rsync-3.5.1.tar.gz" -C "$RUNNER_TEMP/rsync-build"
          cd "$RUNNER_TEMP/rsync-build/rsync-3.5.1" || exit 1
          ./configure --disable-md2man
          make -j "$(nproc)"
          cp rsync "$HOME/rsync-ref/bin/rsync"
      - name: Check the reference rsync
        shell: bash
        run: |
          version="$("$HOME/rsync-ref/bin/rsync" --version)"
          printf '%s\n' "$version" | head -n 1
          checksums="$(printf '%s\n' "$version" | sed -n '/Checksum list/{n;p}')"
          compressors="$(printf '%s\n' "$version" | sed -n '/Compress list/{n;p}')"
          echo "checksums: $checksums"
          echo "compressors: $compressors"
          case "$version" in "rsync  version 3.5.1  protocol version 33"*) ;; *)
            echo "::error title=Reference rsync::$HOME/rsync-ref/bin/rsync is not rsync 3.5.1"
            exit 1
            ;;
          esac
          for need in xxh128 xxh3 xxh64; do
            case " $checksums " in *" $need "*) ;; *) echo "::error title=Reference rsync::built without the $need checksum"; exit 1 ;; esac
          done
          for need in zstd lz4; do
            case " $compressors " in *" $need "*) ;; *) echo "::error title=Reference rsync::built without the $need compressor"; exit 1 ;; esac
          done
      # pi-shell's zsh completion and zsh-oracle tests compare obash with zsh
      # 5.9: its own completion functions (/usr/share/zsh/5.9/functions, or
      # the real zsh's $fpath) and /bin/zsh itself, which must print
      # `zsh 5.9 `. The runner has no zsh, so they skipped. zsh 5.9 is built
      # from the tarball whose sha256 SourceForge and Debian's orig tarball
      # agree on, into ~/zsh-ref, and linked in as /usr/bin/zsh (/bin is
      # /usr/bin) and /usr/share/zsh/5.9. A test that still skips fails the
      # job (the skip scan in the test step).
      - name: Build zsh 5.9
        shell: bash
        run: |
          sudo apt-get -q -o Acquire::Retries=5 update
          sudo apt-get -q -o Acquire::Retries=5 install -y --no-install-recommends libncurses-dev
          bash .github/sami/fetch-verified.sh "zsh 5.9" "$RUNNER_TEMP/zsh-5.9.tar.xz" \
            9b8d1ecedd5b5e81fbf1918e876752a7dd948e05c1a0dba10ab863842d45acd5 \
            https://downloads.sourceforge.net/project/zsh/zsh/5.9/zsh-5.9.tar.xz \
            https://deb.debian.org/debian/pool/main/z/zsh/zsh_5.9.orig.tar.xz
          mkdir -p "$RUNNER_TEMP/zsh-build"
          tar -xJf "$RUNNER_TEMP/zsh-5.9.tar.xz" -C "$RUNNER_TEMP/zsh-build"
          cd "$RUNNER_TEMP/zsh-build/zsh-5.9" || exit 1
          # The runner has no controlling tty, so configure cannot probe
          # tcsetpgrp (run 44806741441); Linux has it, as Debian's build says.
          ./configure --prefix="$HOME/zsh-ref" --enable-multibyte --with-tcsetpgrp
          make -j "$(nproc)"
          make install.bin install.modules install.fns
      - name: Install and check zsh 5.9
        shell: bash
        run: |
          sudo ln -sfn "$HOME/zsh-ref/bin/zsh" /usr/bin/zsh
          sudo mkdir -p /usr/share/zsh
          sudo ln -sfn "$HOME/zsh-ref/share/zsh/5.9" /usr/share/zsh/5.9
          version="$(/bin/zsh --version)"
          echo "$version"
          case "$version" in "zsh 5.9 "*) ;; *)
            echo "::error title=zsh 5.9::/bin/zsh is not zsh 5.9"
            exit 1
            ;;
          esac
          for f in _main_complete compinit; do
            [ -f "/usr/share/zsh/5.9/functions/$f" ] || { echo "::error title=zsh 5.9::no $f in /usr/share/zsh/5.9/functions"; exit 1; }
          done
          /bin/zsh -f -c 'print -rl -- $fpath'
      # pi-shell's bash-oracle tests compare obash with bash 5.2 or later
      # (they were measured with 5.2.21), and report a bash older than that
      # as uncompared, which the skip scan fails; the runner's /bin/bash is
      # 5.1.16. bash 5.2.21 is built from the GNU tarball whose sha256 is
      # pinned here (ftp.gnu.org and its mirror network gave the same bytes,
      # signed by its maintainer's key 7C0135FB088AAF6C66C650B9BB5869F064EA74AB),
      # into ~/bash-ref, and the tests get it as PI_TEST_REAL_BASH; the
      # runner's own bash, which runs every step, stays as it is.
      - name: Build bash 5.2.21
        shell: bash
        run: |
          bash .github/sami/fetch-verified.sh "bash 5.2.21" "$RUNNER_TEMP/bash-5.2.21.tar.gz" \
            c8e31bdc59b69aaffc5b36509905ba3e5cbb12747091d27b4b977f078560d5b8 \
            https://ftpmirror.gnu.org/gnu/bash/bash-5.2.21.tar.gz \
            https://ftp.gnu.org/gnu/bash/bash-5.2.21.tar.gz
          mkdir -p "$RUNNER_TEMP/bash-build"
          tar -xzf "$RUNNER_TEMP/bash-5.2.21.tar.gz" -C "$RUNNER_TEMP/bash-build"
          cd "$RUNNER_TEMP/bash-build/bash-5.2.21" || exit 1
          ./configure --prefix="$HOME/bash-ref"
          make -j "$(nproc)"
          make install
      - name: Check bash 5.2.21
        shell: bash
        run: |
          version="$("$HOME/bash-ref/bin/bash" --version | sed -n 1p)"
          echo "$version"
          case "$version" in "GNU bash, version 5.2.21("*) ;; *)
            echo "::error title=bash 5.2.21::$HOME/bash-ref/bin/bash is not bash 5.2.21"
            exit 1
            ;;
          esac
          echo "the runner's bash: $(/bin/bash --version | sed -n 1p)"
      # pi-vcs's jj tests compare its jj-lib with the jj CLI, and return
      # without a word where there is no `jj`. jj 0.46.0, the jj-lib version
      # Cargo.lock pins (checked here), is the release's static Linux build,
      # pinned by the sha256 GitHub gives for that asset; the test step puts
      # ~/jj-ref/bin on the tests' PATH.
      - name: jj 0.46.0
        shell: bash
        run: |
          echo "the runner's jj: $(command -v jj || echo none)"
          locked="$(awk '$0 == "name = \"jj-lib\"" { getline; print }' Cargo.lock)"
          if [ "$locked" != 'version = "0.46.0"' ]; then
            echo "::error title=jj 0.46.0::Cargo.lock pins jj-lib [$locked], not 0.46.0: pin the jj CLI of that version here"
            exit 1
          fi
          bash .github/sami/fetch-verified.sh "jj 0.46.0" "$RUNNER_TEMP/jj-0.46.0.tar.gz" \
            fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08 \
            https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$HOME/jj-ref/bin"
          tar -xzf "$RUNNER_TEMP/jj-0.46.0.tar.gz" -C "$HOME/jj-ref/bin" ./jj
          version="$("$HOME/jj-ref/bin/jj" --version)"
          echo "$version"
          case "$version" in "jj 0.46.0-"*) ;; *)
            echo "::error title=jj 0.46.0::$HOME/jj-ref/bin/jj is not jj 0.46.0"
            exit 1
            ;;
          esac
      # pi-builtins' sort tests compare collation and numbers under
      # sv_SE.UTF-8, en_US.UTF-8 and de_DE.UTF-8, and skipped the locales the
      # runner had not generated (run 44803069963).
      - name: Locales the tests compare under
        run: |
          sudo locale-gen sv_SE.UTF-8 en_US.UTF-8 de_DE.UTF-8
          locale -a
      # pi-iso clones a tree with reflinks (FICLONE), and pi-vcs's
      # worktree_clone_carry tests skip without them; the runner's ext4 has
      # none. The tests' temporary files go on a loop-mounted XFS with
      # reflink=1, checked here; the test step gives each test action a
      # TMPDIR of its own on it.
      - name: A reflink filesystem for the tests' temporary files
        shell: bash
        run: |
          if ! command -v mkfs.xfs >/dev/null; then
            sudo apt-get -q -o Acquire::Retries=5 update
            sudo apt-get -q -o Acquire::Retries=5 install -y --no-install-recommends xfsprogs
          fi
          truncate -s 12G "$RUNNER_TEMP/reflink.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /mnt/reflink/tmp
          echo probe >/mnt/reflink/tmp/reflink-probe
          cp --reflink=always /mnt/reflink/tmp/reflink-probe /mnt/reflink/tmp/reflink-probe.clone
          rm /mnt/reflink/tmp/reflink-probe /mnt/reflink/tmp/reflink-probe.clone
          findmnt /mnt/reflink
      # The other preconditions the tests read, checked here, so a runner
      # image without one fails by name rather than through tests that print
      # `skipped:`.
      - name: The other preconditions the tests read
        shell: bash
        run: |
          fail() { echo "::error title=Test precondition::$1"; exit 1; }
          # pi-shell's zftp tests listen on a TCP port in 20000-60000 that
          # /etc/services names (zftp opens only named services).
          n="$(awk '$2 ~ /\/tcp$/ { split($2, p, "/"); if (p[1] >= 20000 && p[1] <= 60000) n++ } END { print n + 0 }' /etc/services)"
          [ "$n" -gt 0 ] || fail "/etc/services names no TCP port in 20000-60000"
          echo "/etc/services: $n TCP ports in 20000-60000"
          # The collation tests (zsh_parity's and the sort tests) need the
          # generated locales.
          for l in en_US.utf8 sv_SE.utf8 de_DE.utf8; do
            locale -a | grep -qx "$l" || fail "locale $l is not generated"
          done
          # pi-builtins' locale tests build their own locales with localedef.
          d="$(mktemp -d)"
          localedef -i en_US -f ISO-8859-1 "$d/probe" || fail "localedef cannot build en_US ISO-8859-1"
          rm -rf -- "$d"
          # rsync's xattr and fake-super tests set user xattrs in their
          # TMPDIR, which is on /mnt/reflink/tmp.
          f=/mnt/reflink/tmp/xattr-probe
          : >"$f"
          python3 -c 'import os, sys; os.setxattr(sys.argv[1], "user.probe", b"1"); assert os.getxattr(sys.argv[1], "user.probe") == b"1"' "$f" ||
            fail "/mnt/reflink/tmp takes no user xattrs"
          rm -f -- "$f"
          # du's and rm's unreadable-entry tests need a user that is not root
          # (the main invocation runs as the runner's user).
          [ "$(id -u)" != 0 ] || fail "the job runs as root, so nothing is unreadable to it"
          echo "user: $(id -un) ($(id -u)); user xattrs and localedef work"
          # The sticky-directory FIFO tests (pi-shell's and pi-vfs's) check
          # that fs.protected_fifos refuses an open that may create of a FIFO
          # another user owns in a world-writable sticky directory that user
          # does not own. The test step runs each as root, and as the
          # runner's user given this FIFO: mode 0666, of uid 65534, in a 1777
          # directory of root's. The probe opens it as the tests' plain open
          # does, and the kernel must refuse it.
          sudo sysctl -w fs.protected_fifos=1
          [ "$(cat /proc/sys/fs/protected_fifos)" -ge 1 ] || fail "fs.protected_fifos is not 1 or more"
          sudo install -d -o root -g root -m 1777 /mnt/reflink/sticky
          sudo mkfifo -m 0666 /mnt/reflink/sticky/report.txt
          sudo chown 65534:65534 /mnt/reflink/sticky/report.txt
          ls -ld /mnt/reflink/sticky /mnt/reflink/sticky/report.txt
          python3 -c 'import os, sys
          try:
              os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_NONBLOCK, 0o666)
          except PermissionError:
              sys.exit(0)
          except OSError as err:
              sys.exit(f"the open gave {err}, not EACCES")
          sys.exit("the open went ahead")' /mnt/reflink/sticky/report.txt ||
            fail "an open that may create of /mnt/reflink/sticky/report.txt was not refused, so fs.protected_fifos does not hold here"
          echo "fs.protected_fifos: $(cat /proc/sys/fs/protected_fifos); the sticky directory's FIFO is refused to $(id -un)"
      # pi-vcs's #[ignore]d mount and ownership tests (rust-test-ignored.txt)
      # need places only root can make: a tmpfs, which the runner's user can
      # write, mounted inside a directory that user owns; a file bind-mounted
      # inside another; and an empty directory another user (65534) owns
      # that the runner's user can write, in a directory root owns, so an
      # add cannot put a directory of its own in its place (in run
      # 45325297653 its parent was the runner's, and the add made it
      # again). They go under /mnt/reflink/tmp, and the test step passes
      # their names on to the tests (--test_env).
      - name: The places pi-vcs's ignored tests need
        shell: bash
        run: |
          base=/mnt/reflink/tmp/pi-vcs-places
          install -d "$base/mount-tree/m" "$base/file-tree" "$base/sources"
          sudo mount -t tmpfs -o "size=4m,mode=0755,uid=$(id -u),gid=$(id -g)" tmpfs "$base/mount-tree/m"
          echo 'a file of someone else' >"$base/sources/file"
          : >"$base/file-tree/mounted"
          sudo mount --bind "$base/sources/file" "$base/file-tree/mounted"
          sudo install -d -o root -g root -m 0755 "$base/foreign"
          sudo install -d -o 65534 -g 65534 -m 0777 "$base/foreign/empty"
          findmnt "$base/mount-tree/m"
          findmnt "$base/file-tree/mounted"
          ls -ld "$base/foreign" "$base/foreign/empty"
          {
            echo "PI_VCS_TEST_MOUNT_POINT=$base/mount-tree/m"
            echo "PI_VCS_TEST_MOUNTED_FILE=$base/file-tree/mounted"
            echo "PI_VCS_TEST_FOREIGN_EMPTY_DIR=$base/foreign/empty"
          } >>"$GITHUB_ENV"
      # sdk/rust/omp-rpc's two #[ignore]d smoke tests run the repository's
      # omp server (`bun packages/coding-agent/src/cli.ts --mode rpc`), so the
      # test step runs them alone with --ignored (rust-test-ignored.txt), with
      # the dependencies and the native addon in place. package.json's
      # packageManager names only a floor (bun@>=1.4.4), with which
      # .github/actions/bun-install runs bun.sh's installer for whatever bun
      # is latest. Test code runs in this job, so it gets one exact bun
      # instead: the release zip whose sha256 is pinned here (the release's
      # own digest and its SHASUMS256.txt give the same), and the addon step
      # checks the version it runs. The packages, which run in this job
      # before the test step, come from the registry, not from a GitHub
      # Actions cache another job of this ref could have written: the next
      # step restores no bun store.
      - name: bun 1.4.5
        shell: bash
        run: |
          bash .github/sami/fetch-verified.sh "bun 1.4.5" "$RUNNER_TEMP/bun-linux-x64.zip" \
            94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/bun-linux-x64.zip
          unzip -q -d "$RUNNER_TEMP/bun" "$RUNNER_TEMP/bun-linux-x64.zip"
          mkdir -p "$HOME/.bun/bin"
          install -m 0755 "$RUNNER_TEMP/bun/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
      # What .github/actions/bun-install did with cache: "false", here in the
      # tree, since that action reads package.json at the workspace root,
      # where this job keeps no tree: it fails when the pinned bun does not
      # meet package.json's packageManager, restores no store, and tries the
      # install once more with a cache of its own when the first one fails.
      - name: bun install
        run: |
          want="$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)"
          have="$(bun --version)"
          case "$want" in
            '') ok=false ;;
            '>='*) [ "$(printf '%s\n%s\n' "${want#>=}" "$have" | sort -V | head -n 1)" = "${want#>=}" ] && ok=true || ok=false ;;
            *) [ "$have" = "$want" ] && ok=true || ok=false ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error title=bun::package.json's packageManager asks for bun@[$want], and this job pins bun $have"
            exit 1
          fi
          if bun install --frozen-lockfile; then exit 0; fi
          echo "::warning title=bun install retry::the first install failed; trying again with a clean job-local cache"
          bun install --frozen-lockfile --cache-dir="$(mktemp -d "$RUNNER_TEMP/bun-cache-retry.XXXXXX")"
      # The addon checked above. bazel-natives.ts installs it as it installs a
      # build: it writes this tree's version into the addon's version slot,
      # which the natives job's build wrote with the same version, and loads
      # the addon in a child process. The installed bytes must stay the
      # natives job's.
      - name: The native addon the smoke tests' server loads
        shell: bash
        env:
          WANT_SHA256: ${{ inputs.addon-sha256 }}
        run: |
          if [ "$(bun --version)" != 1.4.5 ]; then
            echo "::error title=bun::$(command -v bun) is bun $(bun --version), not the pinned 1.4.5"
            exit 1
          fi
          bun scripts/bazel-natives.ts linux-x64-modern --source "$RUNNER_TEMP/natives" --dest packages/natives/native
          installed="$(sha256sum packages/natives/native/pi_natives.linux-x64-modern.node | cut -d ' ' -f 1)"
          if [ "$installed" != "$WANT_SHA256" ]; then
            echo "::error title=Native addon::the installed pi_natives.linux-x64-modern.node has sha256 $installed, not the natives job's $WANT_SHA256"
            exit 1
          fi
          ls -l packages/natives/native
      - name: Rust tests against the known-failure list
        shell: bash
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
          # Every error this step prints also goes here, one record a line
          # (.github/sami/findings.sh), and the summary compares each of them
          # with the previous cut's, since this row's verdict is one word over
          # all of them. One file per step: each says for itself whether the
          # step reached its end.
          SAMI_FINDINGS: ${{ runner.temp }}/rust-test/findings/rust-test.tsv
          # sdk/rust/omp-rpc's smoke_real_server starts the omp server, which
          # will not start with no model configured ("No default model
          # selected", run 44889772803). The test sends no prompt, so a
          # placeholder key, which is no credential, selects a model that is
          # never called. The cargo tests see it; Bazel's tests do not (its
          # strict action env passes only the --test_env variables). The omp
          # server reaches a dozen hosts as it starts (run 44898771348), so the
          # #[ignore]d cargo tests, which start it, run with no network but
          # loopback (.github/sami/rust-test-offline.sh).
          ANTHROPIC_API_KEY: placeholder-no-model-call
          RUST_TEST_OFFLINE_UNDER: ${{ github.workspace }}/tree/.github/sami/rust-test-offline.sh
          # The kernel this job runs the tests on, named from where it runs,
          # never from uname: runs-on above is a GitHub-hosted ubuntu VM, whose
          # own Linux kernel runs them, not gVisor. pi-vfs's and pi-shell's FIFO
          # read-open tests compare pi-vfs's gVisor probe (uname's release) with
          # it, and without it check nothing (rust-test.sh refuses to start).
          PI_VFS_TEST_KERNEL: linux
        run: |
          mkdir -p "$(dirname "$SAMI_FINDINGS")"
          RUST_TEST_PATH="$HOME/rsync-ref/bin:$HOME/jj-ref/bin:/usr/local/bin:/usr/bin:/bin" \
            RUST_TEST_TMPDIR=/mnt/reflink/tmp \
            RUST_TEST_STICKY_FIFO=/mnt/reflink/sticky/report.txt \
            PI_TEST_REAL_BASH="$HOME/bash-ref/bin/bash" \
            PI_AST_REPO_CORPUS="$GITHUB_WORKSPACE/tree" \
            bash .github/sami/rust-test.sh
      # cargo's --timings report of each cargo test the step ran (the omp-rpc
      # workspace's targets, the cargo doctests and the #[ignore]d smoke
      # tests), each named by its log's number and its label; the step's
      # summary gives each one's build and test seconds. Kept 14 days, for a
      # reader of the gate run rather than a later job.
      - name: The cargo tests' timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-linux${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/cargo-timings
          retention-days: 14
          if-no-files-found: warn
      # Each Linux test binary's listing, which sami-checks.yml's rust-test-drift job compares
      # with the early ones the macOS inventory read.
      - name: The test binaries' listings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-listings${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/listings
          retention-days: 3
          if-no-files-found: error
      # Every test's result, which sami-checks.yml's rust-test-compare job
      # reads to check a seeded run against a cold one of the same commit
      # (.github/sami/rust-test-results-compare.sh). The cold control's
      # artifact is this name with -cold, so one run can hold both.
      - name: The per-test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-results-linux${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/results
          retention-days: 3
          if-no-files-found: warn
      - name: Every Rust test has a Bazel test target
        # `bazel test //crates/...` runs only Bazel test targets, and most of
        # pi-edit's, pi-shell's and pi-vcs's tests/*.rs files, obash's unit
        # tests and every doctest had none, so they ran nowhere. This fails
        # while any target of the repo's own suite (`bun run test:rs`) lacks
        # one, and names it. It runs after the tests, even when they failed,
        # so one run shows both.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SAMI_FINDINGS: ${{ runner.temp }}/rust-test/findings/parity.tsv
        run: |
          mkdir -p "$(dirname "$SAMI_FINDINGS")"
          bash .github/sami/rust-test-parity.sh
      # What each step of this job found, for sami-checks.yml's summary: it
      # compares each finding with the previous cut's, so that one first made
      # here is named here even where this row failed at the cut before. A
      # step that wrote no file, or whose file has no end line, reads UNKNOWN
      # there. It runs last, after both steps that write one.
      - name: The findings the summary compares with the previous cut's
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sc-findings-rust-test${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/findings
          retention-days: 3
          if-no-files-found: warn

  rust_test_macos:
    # The tests only macOS can run: those compiled only on macOS (in a macOS
    # test binary's listing and not in the Linux listing of the same target,
    # which sami-checks.yml's build job wrote from its cargo test binaries:
    # artifact rust-test-early-listings), and the twelve pi-shell tests that
    # expect macOS's libc, libm or terminfo and are #[ignore]d on other
    # targets (.github/sami/rust-test-macos.txt). This job builds every test
    # target on macos-15, the host release_binary builds darwin-arm64 on,
    # lists them (.github/sami/rust-test-macos-inventory.sh), and runs those
    # tests through the same test step with the same failure, skip and output
    # rules; it fails unless each of them ran. A known printing test runs
    # beside them as the skip scan's canary. It needs no job of this call:
    # the caller starts it once the early listings exist.
    if: inputs.job == 'macos'
    name: Rust tests (bazel, macOS-only tests)
    runs-on: macos-15
    timeout-minutes: 120
    # actions: read downloads the seed artifact of this run or of the newest
    # cut's, and reads that run's seed job log for its sha256; the repository
    # is public, so it reads nothing private. It grants no write of any kind.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the gate's scripts and actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: |
            .github/sami
            .github/sami-checks
            .github/actions
            .github/workflows
            .config
      - name: Check out the tree under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tree
          ref: ${{ inputs.commit }}
          persist-credentials: false
      # See the header: the scripts read their lists at .github/sami.
      - name: The gate's scripts and lists in the tree
        run: |
          rm -rf .github/sami
          cp -R ../tool/.github/sami .github/sami
          echo "the tree's .github/sami against the gate's ($(git -C ../tool rev-parse HEAD)):"
          git status --short -- .github/sami
      # The test step and its harness need bash 4 or later (associative
      # arrays), and macOS's /bin/bash is 3.2 (run 44875114140). bash 5.2.21
      # is built from the GNU tarball whose sha256 rust_test pins for its
      # reference bash, on every run and never from a GitHub Actions cache
      # (as rust_test's tools: about 51 s, run 44987520746), and goes first
      # on PATH for every later step; the tests' own bash stays /bin/bash.
      # The step runs here on macOS's own awk, sed and sort.
      - name: Build bash 5.2.21
        shell: bash
        run: |
          bash .github/sami/fetch-verified.sh "bash 5.2.21" "$RUNNER_TEMP/bash-5.2.21.tar.gz" \
            c8e31bdc59b69aaffc5b36509905ba3e5cbb12747091d27b4b977f078560d5b8 \
            https://ftpmirror.gnu.org/gnu/bash/bash-5.2.21.tar.gz \
            https://ftp.gnu.org/gnu/bash/bash-5.2.21.tar.gz
          mkdir -p "$RUNNER_TEMP/bash-build"
          tar -xzf "$RUNNER_TEMP/bash-5.2.21.tar.gz" -C "$RUNNER_TEMP/bash-build"
          cd "$RUNNER_TEMP/bash-build/bash-5.2.21" || exit 1
          ./configure --prefix="$HOME/bash-ref"
          make -j "$(sysctl -n hw.ncpu)"
          make install
      - name: Check bash 5.2.21
        shell: bash
        run: |
          version="$("$HOME/bash-ref/bin/bash" --version | sed -n 1p)"
          echo "$version"
          case "$version" in "GNU bash, version 5.2.21("*) ;; *)
            echo "::error title=bash 5.2.21::$HOME/bash-ref/bin/bash is not bash 5.2.21"
            exit 1
            ;;
          esac
          echo "$HOME/bash-ref/bin" >>"$GITHUB_PATH"
      - name: The gate's own regression tests
        shell: bash
        run: bash ../tool/.github/sami/tests/run.sh
      - id: bazel
        uses: ./tool/.github/actions/bazel-cache
      # The build seed, as in rust_test above: here it is the macOS seed job's,
      # and the inventory's own `bazel build` of every test target reads it too.
      - name: Which seed this job reads
        id: seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_MODE: ${{ inputs.seed }}
          SEED_SHA256: ${{ inputs.seed-sha256 }}
          SEED_NAME: sc-seed-macos
          SEED_JOB: build seed (macOS)
        run: bash ../tool/.github/sami/gate-seed.sh pick
      - name: Download this run's own seed
        if: ${{ steps.seed.outputs.run-id == github.run_id }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sc-seed-macos
          path: ${{ runner.temp }}/gate-seed
      - name: Download the cut's seed
        if: ${{ steps.seed.outputs.run-id != '' && steps.seed.outputs.run-id != github.run_id }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sc-seed-macos
          run-id: ${{ steps.seed.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate-seed
      - name: Point Bazel at the seed
        shell: bash
        env:
          RC: ${{ steps.bazel.outputs.rc }}
          SEED_ARCHIVE: ${{ runner.temp }}/gate-seed/sc-seed.tar.zst
          SEED_SHA256: ${{ steps.seed.outputs.sha256 }}
          SEED_REASON: ${{ steps.seed.outputs.reason }}
          SEED_RUN_ID: ${{ steps.seed.outputs.run-id }}
        run: bash ../tool/.github/sami/gate-seed.sh use
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-test-early-listings
          path: ${{ runner.temp }}/linux-listings
      # It lists every target it can read and exits 1 for a target with no
      # Linux listing (UNKNOWN); complete=true still lets the next step run
      # the tests it listed.
      - name: The tests only macOS can run
        id: inventory
        shell: bash
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
          SAMI_FINDINGS: ${{ runner.temp }}/rust-test/findings/inventory.tsv
        run: |
          mkdir -p "$(dirname "$SAMI_FINDINGS")"
          bash .github/sami/rust-test-macos-inventory.sh "$RUNNER_TEMP/linux-listings" "$RUNNER_TEMP/macos-inventory.txt"
      - name: The macOS-only Rust tests
        if: ${{ !cancelled() && steps.inventory.outputs.complete == 'true' }}
        shell: bash
        env:
          # As in rust_test, from where this job runs: a GitHub-hosted macOS VM.
          PI_VFS_TEST_KERNEL: darwin
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
          SAMI_FINDINGS: ${{ runner.temp }}/rust-test/findings/rust-test.tsv
        run: |
          mkdir -p "$RUNNER_TEMP/tests" "$(dirname "$SAMI_FINDINGS")"
          RUST_TEST_ONLY="$RUNNER_TEMP/macos-inventory.txt" \
            RUST_TEST_CANARY="//crates/pi-shell:pi-shell_test sys::spawn::unix::tests::abandoned_external_is_killed_after_a_short_grace" \
            RUST_TEST_PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            RUST_TEST_TMPDIR="$RUNNER_TEMP/tests" \
            PI_TEST_REAL_BASH=/bin/bash \
            PI_AST_REPO_CORPUS="$GITHUB_WORKSPACE/tree" \
            bash .github/sami/rust-test.sh
      # As in rust_test: cargo's --timings report of each cargo test the step
      # ran (the omp-rpc workspace's targets and the cargo doctests).
      - name: The cargo tests' timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-macos${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/cargo-timings
          retention-days: 14
          if-no-files-found: warn
      # Every test's result, which sami-checks.yml's rust-test-compare job
      # reads to check a seeded run against a cold one of the same commit
      # (.github/sami/rust-test-results-compare.sh). The cold control's
      # artifact is this name with -cold, so one run can hold both.
      - name: The per-test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-results-macos${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/results
          retention-days: 3
          if-no-files-found: warn
      # As in rust_test: what each step of this job found, which the summary
      # compares with the previous cut's finding by finding.
      - name: The findings the summary compares with the previous cut's
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sc-findings-rust-test-macos${{ inputs.control && '-cold' || '' }}
          path: ${{ runner.temp }}/rust-test/findings
          retention-days: 3
          if-no-files-found: warn

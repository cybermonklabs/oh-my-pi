# One platform of platform-checks.yml: build each tree once, then the test legs that run the
# archives. Called once per platform, so each platform's legs start as soon as its own builds
# are done. See platform-checks.yml for how to dispatch and for the security boundary. Every
# input comes from platform-checks.yml's call, never from github.event: when sami-checks.yml
# calls platform-checks.yml, the event is sami-checks' own push or dispatch.
name: platform checks (one platform)

on:
  workflow_call:
    inputs:
      builds:
        description: "The plan's build matrix for this platform (JSON)"
        required: true
        type: string
      legs:
        description: "The plan's test legs for this platform (JSON)"
        required: true
        type: string
      plant_tree:
        description: "The planted tree id the plan computed"
        required: false
        default: ""
        type: string
      head:
        required: true
        type: string
      base:
        required: false
        default: ""
        type: string
      plant:
        required: false
        default: ""
        type: string
      crates:
        required: true
        type: string
      filter:
        required: true
        type: string
      retries:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: string
      keep_success_output:
        required: false
        default: false
        type: boolean
      skip_bash_install:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Only the build job may write cargo's cache. It declares no cache-mode, so it takes the calling
# job's (write on a dispatch of platform-checks.yml, none from sami-checks.yml); the test legs,
# which run member tests, declare none.

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  NEXTEST_VERSION: "0.9.151"
  PC_HEAD: ${{ inputs.head }}
  PC_BASE: ${{ inputs.base }}
  PC_PLANT: ${{ inputs.plant }}
  PC_CRATES: ${{ inputs.crates }}
  PC_FILTER: ${{ inputs.filter }}
  PC_RETRIES: ${{ inputs.retries }}
  PC_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
  PC_SKIP_BASH_INSTALL: ${{ inputs.skip_bash_install }}
  PC_KEEP_SUCCESS_OUTPUT: ${{ inputs.keep_success_output }}
  PC_PLANT_TREE: ${{ inputs.plant_tree }}

jobs:
  build:
    name: build ${{ matrix.tree }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      PC_PLATFORM: ${{ matrix.platform }}
      PC_TREE: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner paths
        run: bash .github/platform-checks/tree.sh setup
      - name: Tree
        run: |
          if [ "$PC_TREE" = base ]; then sha=$PC_BASE; else sha=$PC_HEAD; fi
          bash .github/platform-checks/tree.sh checkout "$sha"
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=stable
          if [ -f "$PC/tree/rust-toolchain.toml" ]; then
            ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$PC/tree/rust-toolchain.toml" | head -n 1)
            ch=${ch:-stable}
          fi
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: Cargo cache (one per platform and toolchain in this ref)
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: platform-checks-${{ matrix.platform }}
          workspaces: ${{ runner.temp }}/pc/tree -> ../out/target
          cache-on-failure: true
          cache-bin: false
          # One writer per platform: the head job. The base job restores only.
          save-if: ${{ matrix.tree == 'head' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build and archive
        id: build
        env:
          PC_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash .github/platform-checks/build.sh
      - name: Archive for the test legs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-archive-${{ matrix.platform }}-${{ matrix.tree }}
          path: ${{ runner.temp }}/pc/up/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Scan the build logs
        id: scan
        if: always()
        env:
          PC_SCAN_TOKEN: ${{ github.token }}
        run: |
          d="$PC/upload/pc-build-$PC_PLATFORM-$PC_TREE"
          mkdir -p "$d" && cp -R "$PC"/logs/. "$d/"
          $PY .github/platform-checks/pc.py scan "$PC/upload"
      - name: Build logs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-build-${{ matrix.platform }}-${{ matrix.tree }}
          path: ${{ runner.temp }}/pc/upload/
          retention-days: 14
      - name: Build errors (after the scan)
        if: always() && steps.build.outcome == 'failure' && steps.scan.outcome == 'success'
        run: grep -h -A 12 -E '^error(\[|:)' "$PC"/logs/build-*.log | head -n 120

  legs:
    name: test ${{ matrix.tree }} ${{ matrix.who }} ${{ matrix.leg }}
    needs: build
    # The legs of a tree whose archive exists run even when the other tree's build failed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 345
    # A leg runs member tests and restores no cache, so it gets no cache access at all.
    cache-mode: none
    env:
      PC_PLATFORM: ${{ matrix.platform }}
      PC_TREE: ${{ matrix.tree }}
      PC_WHO: ${{ matrix.who }}
      PC_LEG: ${{ matrix.leg }}
      PC_OFFSET: ${{ matrix.offset }}
      PC_COUNT: ${{ matrix.count }}
      PC_PARTITION: ${{ matrix.partition }}
      PC_PARTITIONS: ${{ matrix.partitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner paths
        run: bash .github/platform-checks/tree.sh setup
      - name: Tree (at the path the archive was built from)
        run: |
          if [ "$PC_TREE" = base ]; then sha=$PC_BASE; else sha=$PC_HEAD; fi
          bash .github/platform-checks/tree.sh checkout "$sha"
          if [ "$PC_TREE" = plant ]; then
            got=$(bash .github/platform-checks/tree.sh plant "$PC_PLANT")
            [ "$got" = "$PC_PLANT_TREE" ] || { echo "::error::planted tree $got, not $PC_PLANT_TREE"; exit 1; }
          fi
      - name: Archive
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pc-archive-${{ matrix.platform }}-${{ matrix.build }}
          path: ${{ runner.temp }}/pc/archive
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Host (ubuntu's kernel settings, zsh; macOS's bash 5)
        run: |
          # shellcheck disable=SC2024 # the apt log is the runner's own file
          case "$RUNNER_OS" in
          Linux)
            sudo sysctl -w fs.protected_fifos=1 fs.protected_regular=2 fs.protected_symlinks=1 fs.protected_hardlinks=1
            if ! sudo apt-get install -y -q zsh > "$RUNNER_TEMP/apt.log" 2>&1; then
              sudo apt-get update -q >> "$RUNNER_TEMP/apt.log" 2>&1
              sudo apt-get install -y -q zsh >> "$RUNNER_TEMP/apt.log" 2>&1 || { tail -n 5 "$RUNNER_TEMP/apt.log"; exit 1; }
            fi
            ;;
          macOS)
            # The tests compare against bash 5.2 and 5.3, and macOS's /bin/bash is 3.2. Homebrew's
            # bash goes first on PATH and into PI_TEST_REAL_BASH. A leg that does not get bash 5
            # there stops here and reads UNKNOWN with the reason; it never runs on bash 3.2.
            # skip_bash_install is that check's control.
            prefix=$(brew --prefix)
            if [ "$PC_SKIP_BASH_INSTALL" != true ]; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash > "$RUNNER_TEMP/brew.log" 2>&1 ||
                tail -n 5 "$RUNNER_TEMP/brew.log"
            fi
            export PATH="$prefix/bin:$PATH"
            got=$(command -v bash)
            major=$(bash -c 'echo "${BASH_VERSINFO[0]}"' 2> /dev/null)
            why=""
            if [ "$got" != "$prefix/bin/bash" ]; then
              why="bash on PATH is ${got:-none}, not $prefix/bin/bash (the Homebrew install failed or was skipped)"
            elif ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 5 ]; then
              why="$got is bash ${major:-?}, not 5 or later"
            fi
            if [ -n "$why" ]; then
              {
                echo "platform=$PC_PLATFORM"
                echo "tree=$PC_TREE"
                echo "who=$PC_WHO"
                echo "leg=$PC_LEG"
                echo "note=no bash 5 on this macOS leg: $why"
              } > "$PC/results/meta.env"
              echo "::error::no bash 5 on this macOS leg: $why"
              exit 1
            fi
            echo "$prefix/bin" >> "$GITHUB_PATH"
            echo "PI_TEST_REAL_BASH=$prefix/bin/bash" >> "$GITHUB_ENV"
            ;;
          esac
          {
            echo "uname=$(uname -srm)"
            for k in protected_fifos protected_regular protected_symlinks protected_hardlinks; do
              if [ -r "/proc/sys/fs/$k" ]; then echo "fs.$k=$(cat "/proc/sys/fs/$k")"; fi
            done
            echo "zsh=$(zsh --version 2> /dev/null || echo none)"
            echo "bash=$(bash --version | head -n 1)"
            echo "bash_path=$(command -v bash)"
            echo "cpus=$(getconf _NPROCESSORS_ONLN 2> /dev/null || echo "${NUMBER_OF_PROCESSORS:-?}")"
          } | tee "$PC/results/host.env"
      - name: Tests
        run: bash .github/platform-checks/leg.sh
      - name: Scan the results
        id: scan
        if: always()
        env:
          PC_SCAN_TOKEN: ${{ github.token }}
        run: |
          d="$PC/upload/pc-results-$PC_PLATFORM-$PC_TREE-$PC_WHO-$PC_LEG"
          mkdir -p "$d" && cp -R "$PC"/results/. "$d/"
          $PY .github/platform-checks/pc.py scan "$PC/upload"
      - name: Results
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-results-${{ matrix.platform }}-${{ matrix.tree }}-${{ matrix.who }}-${{ matrix.leg }}
          path: ${{ runner.temp }}/pc/upload/
          retention-days: 14

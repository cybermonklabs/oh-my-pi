name: Build sami branch

# How the release owner cuts a release:
#   1. Push the composed candidate to sami-candidate. That push runs every
#      job here but publish: carry, version, release_binary (it builds,
#      smoke-tests and uploads the archives), attest (it attests the
#      archives, their sidecars and the release notes) and
#      release_cache_prune. The same push runs sami-checks.yml, the Rust
#      tests (sami-rust-test.yml) among its checks; they report, and publish
#      does not wait for them or read them.
#   2. Wait for that run of this workflow to go green.
#   3. Fast-forward sami to exactly that commit.
#   4. The push to sami runs only publish, which publishes that run's
#      attested archives. It never rebuilds.
# For a pushed sami commit that carries this file and
# .github/sami/release-candidate.sh as they are here: with no green
# sami-candidate run of that commit, publish fails and publishes nothing. An
# archive whose sha256 is not the one the candidate run attested is refused
# and named with both digests, and nothing is published. A candidate whose
# carry check named a release older than the newest one is refused too: a
# release published after that check was not compared with it. A run on sami
# other than that push (a dispatch) runs no job. A dispatch on another ref
# builds and smoke-tests, and attests nothing, while that ref carries this
# file: GitHub runs the dispatched ref's own sami-build.yml, so a ref whose copy
# was changed can attest. publish's checks keep that run's files out of a
# release (see the attest job).
# The release build cache is saved only on a push to sami-candidate, where
# release_cache_prune keeps one entry per target; sami, where nothing is
# built, keeps none.
# Known limit: a push to sami runs the pushed commit's own sami-build.yml and
# release-candidate.sh. One from before this workflow (a72018dd, sami's head
# on 2026-11-23, among them) builds and publishes at once, and one whose
# copies were changed publishes what its own copies allow. For the same
# reason, a push of any branch whose own workflow asks for contents: write
# can create a release directly, and a ruleset on sami would not stop it.
# Any identity of the agent App sjawhar-agent[bot] can push sami and
# sami-candidate. No ruleset guards either ref, by the decision of
# 2026-11-23: no wrong push has been seen, and a protection against a risk
# nobody has seen waits for a person's request.

on:
  push:
    branches:
      - sami
      - sami-candidate
  workflow_dispatch:

# Each job that needs more than reading the repository says so itself.
permissions:
  contents: read

# Only release_binary may restore or save GitHub Actions caches: it sets
# cache-mode: write, and every other job gets a cache token that can do
# neither. Harness cases W1 to W5, W10, W11, W13 to W22, W26, W27 and W38
# (.github/sami/tests/run.sh) keep it so. The Rust tests, which run test code
# with root on their runners on the same push, are in sami-rust-test.yml,
# whose jobs have cache-mode none (its header says which cases keep it so),
# so that code cannot write an entry that release_binary restores.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

jobs:
  carry:
    # A release is a flat merge of member branches, so the previous release is
    # not an ancestor of this one and nothing else notices when a composition
    # drops or reverts what the previous release carried (v18.16.0 lost two
    # commits of v18.13.3 that way). Fails unless every previous-release commit
    # is carried or named in .github/sami/carried-drops.txt.
    # A run on sami (a push or a dispatch) builds nothing: publish takes the
    # candidate run's archives and notes.
    if: ${{ github.ref != 'refs/heads/sami' }}
    name: Carries the previous release
    runs-on: ubuntu-22.04
    # The attest job downloads the notes by this id, so a later replacement
    # of the artifact (it gets a new id) is not what it attests.
    outputs:
      notes-artifact-id: ${{ steps.upload-notes.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch upstream trunk
        run: git fetch --no-tags https://github.com/can1357/oh-my-pi.git main:refs/remotes/upstream/main
      - name: Check carriage against the newest v*-sami.* tag
        run: |
          bash .github/sami/carry-check.sh --new HEAD --upstream upstream/main --notes "$RUNNER_TEMP/carry-notes.md"
          cat "$RUNNER_TEMP/carry-notes.md" >>"$GITHUB_STEP_SUMMARY"
      # publish takes the release notes from this artifact, and publishes
      # them only if the attest job of the candidate run attested them.
      - name: Upload the release notes
        id: upload-notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/carry-notes.md
          if-no-files-found: error

  version:
    needs: carry
    if: ${{ github.ref != 'refs/heads/sami' }}
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sjawhar/.github/.github/actions/sami-version@v1
        id: version
        with:
          source: bun
          manifest_path: packages/coding-agent/package.json

  release_binary:
    needs: version
    if: ${{ github.ref != 'refs/heads/sami' }}
    cache-mode: write
    # Each leg sets the id of its own mise-* artifact, which the attest job
    # downloads by id. The other leg's output is empty, and an empty output
    # is not set and does not clear the first leg's value (GitHub's workflow
    # syntax, "Using Job Outputs in a Matrix Job").
    outputs:
      mise-linux-x64-artifact-id: ${{ matrix.target == 'linux-x64' && steps.upload-mise.outputs.artifact-id || '' }}
      mise-darwin-arm64-artifact-id: ${{ matrix.target == 'darwin-arm64' && steps.upload-mise.outputs.artifact-id || '' }}
    env:
      # The release build cache. The restore and save steps must name the
      # same paths. The bounds keep one entry per target small next to
      # GitHub's 10 GB cache limit for the whole repository: Bazel's disk
      # cache (its garbage collection deletes the least recently used
      # actions), and the downloads (Bazel's repository cache and the cargo
      # registry), which are emptied when they grow past theirs. Each push
      # to sami-candidate saves a new entry per target (the key ends in the
      # commit, and GitHub never overwrites a key), and release_cache_prune
      # then deletes the entries it supersedes. So on sami-candidate the
      # cache holds one entry per target, about 1.40 GB for linux-x64 and
      # 0.95 GB for darwin-arm64 (about 2.35 GB), and up to twice that in the
      # minutes between a save and the prune; sami, where nothing is built,
      # holds none. Without the prune the ref would gain about 2.35 GB a
      # push, and past 10 GB GitHub deletes the least recently used entries
      # of every workflow in the repository.
      RELEASE_CACHE_PATHS: |
        ~/.cache/omp-release-bazel
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        ~/.cargo/git/db
      BAZEL_DISK_CACHE_MAX_BYTES: "3221225472" # 3 GiB
      DOWNLOADS_MAX_BYTES: "1610612736" # 1.5 GiB
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          # GitHub retired the macOS 14 image on 2026-11-02, and refuses
          # macos-14 since. macos-15 is the host upstream's CI builds
          # darwin-arm64 on; a newer host can raise the binary's minimum macOS.
          - runner: macos-15
            target: darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Bun version follows package.json "packageManager" (exact pin or floor),
      # the same way upstream's CI does; a hard pin here lags upstream's floor
      # and produced a binary that crashed at startup under 18.2.0's bytecode.
      # bun's store is not restored here (cache: "false"): bun-install saves
      # it on a run on main, and this job saves only the release build cache
      # below. A harness case (W2) keeps it so.
      - uses: ./.github/actions/bun-install
        with:
          cache: "false"
      - id: bazel
        uses: ./.github/actions/bazel-cache
      # .github/actions/bazel-cache gives Bazel a cache only on upstream's vmon
      # runners. On these GitHub-hosted runners it says "Not a vmon runner;
      # building uncached", so every release compiled every native crate from
      # nothing: "Build native addons" took a median of 36 min on ubuntu-22.04
      # and 27 min on macos-15 over the 19 pushes of 2026-11-19 to 11-22. The
      # steps below keep Bazel's disk cache and repository cache, and the
      # cargo registry that crate_universe reads (CARGO_BAZEL_ISOLATED=0 in
      # .bazelrc), in GitHub's Actions cache: each push to sami-candidate, the
      # ref the release is built on, restores the newest entry for its ref and
      # target and saves a new one. Whoever can push sami-candidate can seed
      # what this job restores; the same identities can push sami, which
      # publishes, so the cache gives them nothing they lack. A candidate's
      # own code also runs here before the save, red or green, so its
      # outputs reach the entry the next candidate restores. When a candidate
      # is dropped because its code is not trusted, delete sami-candidate's
      # entries before the next candidate push (or bump v1 in all four
      # places: the key, both restore-keys, and release_cache_prune's prefix):
      #   gh api --paginate 'repos/cybermonklabs/oh-my-pi/actions/caches?ref=refs/heads/sami-candidate&key=omp-release-bazel-v1-' -q '.actions_caches[].id' |
      #     xargs -I{} gh api -X DELETE repos/cybermonklabs/oh-my-pi/actions/caches/{}
      - name: Restore the release build cache
        id: release-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.RELEASE_CACHE_PATHS }}
          # Each key names the run's ref, so an entry that a run on another
          # ref wrote (a restore also looks in main's scope) cannot match by
          # accident. A run elsewhere that writes a key with this name on
          # purpose still could; no enabled workflow on main does.
          key: omp-release-bazel-v1-${{ github.ref_name }}-${{ matrix.target }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', 'rust-toolchain.toml', '.bazelversion') }}-${{ github.sha }}
          # An upstream version bump rewrites Cargo.lock, so most releases
          # take the last fallback, the newest entry for this ref and target.
          # Bazel keys each action by the digests of its inputs, so an older
          # entry gives fewer hits, never a wrong output.
          restore-keys: |
            omp-release-bazel-v1-${{ github.ref_name }}-${{ matrix.target }}-${{ hashFiles('MODULE.bazel.lock', 'Cargo.lock', 'rust-toolchain.toml', '.bazelversion') }}-
            omp-release-bazel-v1-${{ github.ref_name }}-${{ matrix.target }}-
      - name: Point Bazel at the release build cache
        env:
          RC: ${{ steps.bazel.outputs.rc }}
        run: |
          cache="$HOME/.cache/omp-release-bazel"
          mkdir -p "$cache/disk" "$cache/repo"
          {
            echo "common --disk_cache=$cache/disk"
            echo "common --repository_cache=$cache/repo"
            # Extracted repositories would go to <repository_cache>/contents,
            # which nothing bounds; keep them out of the saved entry.
            echo "common --repo_contents_cache=$RUNNER_TEMP/bazel-repo-contents"
            # Bazel 9.2 has only the experimental_ names of these flags. Its
            # server collects disk cache garbage after it has been idle for
            # the delay, 5 minutes by default, which this job never is; at 0
            # the collection starts when the build's last command ends.
            echo "common --experimental_disk_cache_gc_max_size=$BAZEL_DISK_CACHE_MAX_BYTES"
            echo "common --experimental_disk_cache_gc_idle_delay=0s"
          } >>"$RC"
      - name: Build native addons
        id: natives
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bun scripts/bazel-natives.ts ${{ matrix.native_targets }} --dest packages/natives/native
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke test binary
        # `--version` prints the version without loading the native addon, so
        # only `--smoke-test` shows that the binary starts with its addon. It
        # needs no network and no login.
        run: |
          runtime_dir="$(mktemp -d)"
          bin="./packages/coding-agent/binaries/omp-${{ matrix.target }}"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" "$bin" --version
          out="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" "$bin" --smoke-test)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qxF 'smoke-test: ok'
      - name: Package mise asset
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="omp-${TAG}-${TARGET}"
          mkdir -p "release/${asset}/bin"
          cp "packages/coding-agent/binaries/omp-${TARGET}" "release/${asset}/bin/omp"
          tar -C release -czf "release/${asset}.tar.gz" "$asset"
          # The sidecar, one sha256sum line, is attested with the archive. It
          # lets publish name the digest this run attested when an archive it
          # downloads differs: GitHub has no API that lists attestations by
          # run or by name. macos-15 has shasum, which writes the same line.
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          (cd release && "${sum[@]}" "${asset}.tar.gz" >"${asset}.tar.gz.sha256")
          cat "release/${asset}.tar.gz.sha256"
      # The attest job attests these files, by this artifact's id, once both
      # legs have uploaded them.
      - name: Upload the archive and its sidecar
        id: upload-mise
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mise-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error
      # Only a push to sami-candidate saves the cache; a dispatch or any other
      # event only restores. cache-mode takes no expression, so this condition
      # on the bound and save steps enforces it (harness cases W14 to W19, W26,
      # W27 and W38). A failed build's finished actions are still valid results,
      # so the cache is saved whenever the native build ran. A re-run of the
      # same commit restored its exact key and has nothing to save.
      - name: Bound the release build cache
        id: release-cache-bound
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sami-candidate' && !cancelled() && steps.release-cache.outputs.cache-hit != 'true' && (steps.natives.outcome == 'success' || steps.natives.outcome == 'failure') }}
        shell: python3 {0}
        run: |
          import os, shutil, time

          home = os.path.expanduser("~")
          disk = os.path.join(home, ".cache/omp-release-bazel/disk")
          downloads = [os.path.join(home, p) for p in (
              ".cache/omp-release-bazel/repo",
              ".cargo/registry/index",
              ".cargo/registry/cache",
              ".cargo/git/db",
          )]
          disk_max = int(os.environ["BAZEL_DISK_CACHE_MAX_BYTES"])
          downloads_max = int(os.environ["DOWNLOADS_MAX_BYTES"])

          def size(root, skip=()):
              """Bytes in regular files under root, as Bazel's collection counts them."""
              skip = {os.path.join(root, name) for name in skip}
              total, dirs = 0, [root]
              while dirs:
                  try:
                      entries = list(os.scandir(dirs.pop()))
                  except FileNotFoundError:
                      continue
                  for entry in entries:
                      try:
                          if entry.is_file(follow_symlinks=False):
                              total += entry.stat(follow_symlinks=False).st_size
                          elif entry.is_dir(follow_symlinks=False) and entry.path not in skip:
                              dirs.append(entry.path)
                      except FileNotFoundError:  # the collection deleted it
                          pass
              return total

          # The collection runs in Bazel's server after the build, while the
          # steps above run; wait for it to bring the disk cache under the
          # bound. Bazel leaves tmp/ and gc/ out of its count.
          deadline = time.monotonic() + 120
          while size(disk, ("tmp", "gc")) > disk_max and time.monotonic() < deadline:
              time.sleep(5)
          # Files in tmp/ are writes that never finished (Bazel renames a
          # finished write into place), and the collection never deletes
          # them: drop them, then count everything the save would archive.
          shutil.rmtree(os.path.join(disk, "tmp"), ignore_errors=True)
          disk_size = size(disk)
          downloads_size = sum(size(path) for path in downloads)
          if downloads_size > downloads_max:
              # Downloads are found by their content, and a miss downloads
              # again: empty them, and the next build keeps what it fetches.
              for path in downloads:
                  shutil.rmtree(path, ignore_errors=True)
              print(f"::notice title=Release build cache::The downloads held {downloads_size} bytes, over their bound; emptying them.")
              downloads_size = sum(size(path) for path in downloads)
          print(f"Bazel disk cache: {disk_size} bytes, bound {disk_max}")
          print(f"Downloads: {downloads_size} bytes, bound {downloads_max}")
          save = 0 < disk_size <= disk_max and downloads_size <= downloads_max
          if not save:
              print(f"::warning title=Release build cache::Not saved: the Bazel disk cache holds {disk_size} bytes (bound {disk_max}, and it must not be empty) and the downloads {downloads_size} bytes (bound {downloads_max}).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"save={'true' if save else 'false'}\n")
      - name: Save the release build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sami-candidate' && !cancelled() && steps.release-cache-bound.outputs.save == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.RELEASE_CACHE_PATHS }}
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  attest:
    # The only job that can sign: no other job, and not the workflow, holds
    # id-token: write. It attests the archives and their sidecars that both
    # legs of release_binary uploaded, and the release notes carry uploaded,
    # once all three succeeded, and runs no repository code: no checkout and
    # no run step, only actions/download-artifact and
    # actions/attest-build-provenance, pinned by commit. It downloads the
    # three artifacts by the ids their upload steps gave: a job of this run
    # can delete an artifact and upload another under its name, but not
    # under its id, so what it attests is what carry and release_binary
    # uploaded. Each file has its own attest step, so a missing file fails
    # this job and the candidate run is red before sami moves. Harness cases
    # W39 to W67
    # (.github/sami/tests/run.sh) keep it so. It runs only on a push to
    # sami-candidate, so the public transparency log gets no trial entries.
    # This if: does not keep a dispatch run's files out of a release: GitHub
    # runs the workflow file of the ref a run is on, and that file can attest
    # anything. publish's checks do (.github/sami/release-candidate.sh): find
    # takes only a run of a push to sami-candidate at the pushed commit, the
    # downloads take that run's artifacts by its run id, and verify accepts a
    # file only with an attestation whose certificate names that run
    # (runInvocationURI), a push (buildTrigger) and sami-build.yml at
    # refs/heads/sami-candidate (its subject and buildSignerURI), from the
    # pushed commit on that ref.
    name: Attest the release archives and notes
    needs: [carry, release_binary]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sami-candidate' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Each artifact goes to a directory of its own, named for the artifact
      # (merge-multiple is off). An id that no longer exists is only a
      # warning here; the attest steps below then find no file there.
      - name: Download the archives and the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.carry.outputs.notes-artifact-id }},${{ needs.release_binary.outputs.mise-linux-x64-artifact-id }},${{ needs.release_binary.outputs.mise-darwin-arm64-artifact-id }}
          path: ${{ runner.temp }}/attest
      # One step per file: a subject-path that matches no file fails its
      # step ("Could not find subject at path", actions/attest's
      # src/subject.ts at 508db95d, which this action runs), so a missing
      # archive, sidecar or notes file fails the job.
      - name: Attest the linux-x64 archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/mise-linux-x64/*.tar.gz
      - name: Attest the linux-x64 sidecar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/mise-linux-x64/*.tar.gz.sha256
      - name: Attest the darwin-arm64 archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/mise-darwin-arm64/*.tar.gz
      - name: Attest the darwin-arm64 sidecar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/mise-darwin-arm64/*.tar.gz.sha256
      - name: Attest the release notes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/release-notes/carry-notes.md

  release_cache_prune:
    # Keeps the newest release build cache entry of each target in this
    # ref and deletes the rest (see release_binary's env). It runs on a push
    # to sami-candidate, the only run that saves an entry; a push to sami
    # builds and saves nothing. No checkout and no member code: it only
    # lists and deletes this ref's entries whose key starts with
    # omp-release-bazel-v1-<ref>-, and this job alone may delete cache
    # entries. Harness cases W28 to W37 check that it names no action,
    # listed interpreter or downloader, git or repository path and calls gh
    # only on actions/caches or `gh cache`, and that no other job's line
    # grants actions write.
    name: Keep one release build cache per target
    needs: release_binary
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/sami-candidate' }}
    # The run's conclusion, which publish reads, follows the build, its smoke
    # tests and attest; a failed prune shows only on this job. The step, not
    # the job, has the 10-minute limit: past it the step fails, which
    # continue-on-error covers, whereas at a job's limit GitHub cancels the
    # job.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded release build caches of this ref
        timeout-minutes: 10
        run: |
          prefix="omp-release-bazel-v1-${GITHUB_REF_NAME}-"
          # A line per entry: id, key, creation time, bytes, group. The group
          # is the key without its -<64 hex lock hash>-<40 hex commit> end,
          # so it names the ref and the target. A key without that end is
          # UNGROUPED: it is never deleted, and it fails the step.
          list() {
            gh api --paginate -X GET "repos/$GH_REPO/actions/caches" \
              -f key="$prefix" -f ref="$GITHUB_REF" -F per_page=100 \
              -q '.actions_caches[] | [.id, .key, .created_at, .size_in_bytes, (.key | if test("-[0-9a-f]{64}-[0-9a-f]{40}$") then sub("-[0-9a-f]{64}-[0-9a-f]{40}$"; "") else "UNGROUPED" end)] | @tsv'
          }
          list >caches.tsv
          echo "CACHES $(wc -l <caches.tsv) entries of this ref before"
          if [ ! -s caches.tsv ]; then
            echo "::warning title=Release build cache::CACHES UNKNOWN: no entry of $GITHUB_REF has a key that starts with $prefix, so nothing was pruned; the key format may have changed"
            exit 0
          fi
          if cut -f5 caches.tsv | grep -qx UNGROUPED; then
            echo "::warning title=Release build cache::CACHES UNKNOWN: an entry of $GITHUB_REF has a key without the -<lock hash>-<commit> end, so it is not pruned; the key format may have changed"
          fi
          # Newest first: each entry after the first of its group is superseded.
          sort -t$'\t' -k3,3r -k1,1nr caches.tsv | awk -F'\t' '$5 == "UNGROUPED" { next } ($5 in kept) { print; next } { kept[$5] = 1 }' >superseded.tsv
          while IFS=$'\t' read -r id key created size _; do
            # The run of a later push may have deleted it first: that is done too.
            if gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" >/dev/null 2>&1; then
              echo "DELETED $key ($((size / 1000000)) MB, created $created)"
            else
              echo "GONE $key (deleted elsewhere, or the delete failed)"
            fi
          done <superseded.tsv
          list >after.tsv
          # Only the entries listed before the deletes count: an entry a later
          # push saved while this job ran is for that run's prune.
          awk -F'\t' 'NR == FNR { seen[$1] = 1; next }
            { total++; s += $4 }
            !($1 in seen) { later++; next }
            $5 == "UNGROUPED" { print "UNGROUPED " $2; bad = 1; next }
            { n[$5]++ }
            END {
              for (g in n) { printf "KEPT %s: %d entr%s\n", g, n[g], (n[g] == 1 ? "y" : "ies"); if (n[g] > 1) bad = 1 }
              if (later) printf "LATER %d entries a later push saved while this job ran\n", later
              printf "CACHES %d entries of this ref after, %.2f GB\n", total, s / 1e9; exit bad }' caches.tsv after.tsv

  publish:
    # A push to sami runs only this job, and it builds nothing. It takes the
    # green sami-build run of sami-candidate at the same commit, downloads
    # that run's archives and release notes, and publishes them only after
    # .github/sami/release-candidate.sh checks that each one is a file that
    # run attested (its attest job, on the push, signed by sami-build.yml at
    # refs/heads/sami-candidate) and that there is exactly one archive per
    # release target. A red release_binary or attest leaves the candidate
    # run red, so no run is found and nothing is published; sami-checks.yml's
    # run, the Rust tests among it, is not read. The checkout has the tags:
    # the check names the newest release, which the candidate's notes must
    # name.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sami' }}
    runs-on: ubuntu-22.04
    # One publish at a time: a second push to sami waits for the first, and
    # then its notes check sees the release the first one published. GitHub
    # keeps one waiting run per group; a third push cancels the waiting one,
    # which then publishes nothing.
    concurrency:
      group: sami-publish
      cancel-in-progress: false
    # contents: write creates the release; actions: read downloads another
    # run's artifacts; attestations: read reads the attestations.
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      CANDIDATE_BRANCH: sami-candidate
      # release_binary's matrix targets: one archive of each is published.
      RELEASE_TARGETS: linux-x64 darwin-arm64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Find the candidate run
        id: candidate
        run: bash .github/sami/release-candidate.sh find
      # Each artifact goes to a directory of its own (merge-multiple is off),
      # so the check below sees which artifact gave which file.
      - name: Download the candidate run's archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: mise-*
          path: ${{ runner.temp }}/candidate
      - name: Download the candidate run's release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          name: release-notes
          path: ${{ runner.temp }}/candidate/release-notes
      - name: Check the archives and notes against the candidate run's attestations
        id: verify
        env:
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: bash .github/sami/release-candidate.sh verify
      - uses: sjawhar/.github/.github/actions/sami-release@v1
        with:
          tag: ${{ steps.verify.outputs.tag }}
          files: ${{ steps.verify.outputs.files }}
          body: |
            Automated build from the sami branch.

            Commit: ${{ github.sha }}

            ${{ steps.verify.outputs.notes }}

            Also excluded: #17964 (per-provider prompt-cache retention and cache warming). No member carries it. The earlier warming implementation was removed after a replay measured only 0.8% benefit. The reworked change remains in upstream review.

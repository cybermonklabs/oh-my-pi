name: Build sami branch

on:
  push:
    branches:
      - sami
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carry:
    # A release is a flat merge of member branches, so the previous release is
    # not an ancestor of this one and nothing else notices when a composition
    # drops or reverts what the previous release carried (v18.16.0 lost two
    # commits of v18.13.3 that way). Fails unless every previous-release commit
    # is carried or named in .github/sami/carried-drops.txt.
    name: Carries the previous release
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch upstream trunk
        run: git fetch --no-tags https://github.com/can1357/oh-my-pi.git main:refs/remotes/upstream/main
      - name: Check carriage against the newest v*-sami.* tag
        id: check
        run: |
          bash .github/sami/carry-check.sh --new HEAD --upstream upstream/main --notes "$RUNNER_TEMP/carry-notes.md"
          # sami-release pastes its body into a double-quoted shell echo, so the
          # notes must not carry quotes, backquotes, dollars or backslashes.
          {
            echo "notes<<CARRY_NOTES_EOF"
            tr -d '"`$\\' <"$RUNNER_TEMP/carry-notes.md"
            echo "CARRY_NOTES_EOF"
          } >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/carry-notes.md" >>"$GITHUB_STEP_SUMMARY"

  version:
    needs: carry
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: sjawhar/.github/.github/actions/sami-version@v1
        id: version
        with:
          source: bun
          manifest_path: packages/coding-agent/package.json

  release_binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          - runner: macos-14
            target: darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Bun version follows package.json "packageManager" (exact pin or floor),
      # the same way upstream's CI does; a hard pin here lags upstream's floor
      # and produced a binary that crashed at startup under 18.2.0's bytecode.
      - uses: ./.github/actions/bun-install
      - id: bazel
        uses: ./.github/actions/bazel-cache
      - name: Build native addons
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bun scripts/bazel-natives.ts ${{ matrix.native_targets }} --dest packages/natives/native
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke test binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" \
            ./packages/coding-agent/binaries/omp-${{ matrix.target }} --version
      - name: Package mise asset
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="omp-${TAG}-${TARGET}"
          mkdir -p "release/${asset}/bin"
          cp "packages/coding-agent/binaries/omp-${TARGET}" "release/${asset}/bin/omp"
          tar -C release -czf "release/${asset}.tar.gz" "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release_github:
    needs: [carry, version, release_binary]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mise-*
          path: release
          merge-multiple: true
      - uses: sjawhar/.github/.github/actions/sami-release@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          files: release/*.tar.gz
          body: |
            Automated build from the sami branch.

            Commit: ${{ github.sha }}

            ${{ needs.carry.outputs.notes }}

            Also excluded: #17964 at e337d4e44888 (per-provider prompt-cache retention and cache warming). This head is not among the 44 members. The earlier warming implementation was removed after a replay measured only 0.8% benefit. The reworked head remains in upstream review and is not added by this cut.

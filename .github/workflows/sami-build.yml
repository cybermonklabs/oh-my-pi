name: Build sami branch

on:
  push:
    branches:
      - sami
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carry:
    # A release is a flat merge of member branches, so the previous release is
    # not an ancestor of this one and nothing else notices when a composition
    # drops or reverts what the previous release carried (v18.16.0 lost two
    # commits of v18.13.3 that way). Fails unless every previous-release commit
    # is carried or named in .github/sami/carried-drops.txt.
    name: Carries the previous release
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch upstream trunk
        run: git fetch --no-tags https://github.com/can1357/oh-my-pi.git main:refs/remotes/upstream/main
      - name: Check carriage against the newest v*-sami.* tag
        id: check
        run: |
          bash .github/sami/carry-check.sh --new HEAD --upstream upstream/main --notes "$RUNNER_TEMP/carry-notes.md"
          # sami-release pastes its body into a double-quoted shell echo, so the
          # notes must not carry quotes, backquotes, dollars or backslashes.
          {
            echo "notes<<CARRY_NOTES_EOF"
            tr -d '"`$\\' <"$RUNNER_TEMP/carry-notes.md"
            echo "CARRY_NOTES_EOF"
          } >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/carry-notes.md" >>"$GITHUB_STEP_SUMMARY"

  version:
    needs: carry
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: sjawhar/.github/.github/actions/sami-version@v1
        id: version
        with:
          source: bun
          manifest_path: packages/coding-agent/package.json

  release_binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            native_targets: linux-x64-baseline linux-x64-modern
          # GitHub retired the macOS 14 image on 2026-11-02, and refuses
          # macos-14 since. macos-15 is the host upstream's CI builds
          # darwin-arm64 on; a newer host can raise the binary's minimum macOS.
          - runner: macos-15
            target: darwin-arm64
            native_targets: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Bun version follows package.json "packageManager" (exact pin or floor),
      # the same way upstream's CI does; a hard pin here lags upstream's floor
      # and produced a binary that crashed at startup under 18.2.0's bytecode.
      - uses: ./.github/actions/bun-install
      - id: bazel
        uses: ./.github/actions/bazel-cache
      - name: Build native addons
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bun scripts/bazel-natives.ts ${{ matrix.native_targets }} --dest packages/natives/native
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke test binary
        # `--version` prints the version without loading the native addon, so
        # only `--smoke-test` shows that the binary starts with its addon. It
        # needs no network and no login.
        run: |
          runtime_dir="$(mktemp -d)"
          bin="./packages/coding-agent/binaries/omp-${{ matrix.target }}"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" "$bin" --version
          out="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/data" "$bin" --smoke-test)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qxF 'smoke-test: ok'
      - name: Package mise asset
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="omp-${TAG}-${TARGET}"
          mkdir -p "release/${asset}/bin"
          cp "packages/coding-agent/binaries/omp-${TARGET}" "release/${asset}/bin/omp"
          tar -C release -czf "release/${asset}.tar.gz" "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  rust_test:
    # Upstream runs these tests in ci.yml's rust_validate job, on upstream's
    # self-hosted vmon runners, which the fork has no access to; so every fork
    # run of it is cancelled and no sami release ran a Rust test. This job runs
    # the same `bazel test //crates/...` on a GitHub-hosted runner, uncached as
    # release_binary builds, and release_github waits for it. It needs no
    # earlier job, so it starts beside carry rather than after the version.
    # It runs the Bazel test targets only, as rust_validate does: the files
    # under crates/*/tests that no BUILD.bazel names, and the doctests, do not
    # run here.
    # A test that fails at a release for a reason being fixed elsewhere is
    # named in .github/sami/rust-test-known-failures.txt. The job fails when a
    # test that is not named fails, when a target fails to build, and when a
    # named test does not fail, so a fix that lands empties the list.
    name: Rust tests (bazel)
    runs-on: ubuntu-22.04
    # Uncached, the build and the tests took 17 minutes (run 44696018007).
    timeout-minutes: 60
    # Test code and dev-dependency build scripts run here, so the job gets a
    # read-only token, and checkout keeps no credential in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-install
      - id: bazel
        uses: ./.github/actions/bazel-cache
      - name: Rust tests against the known-failure list
        # bash with pipefail: a failed jq or awk must fail the step, never read
        # as "no test failed".
        shell: bash
        env:
          OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          list=.github/sami/rust-test-known-failures.txt
          bep="$RUNNER_TEMP/rust-test-bep.json"
          bep_root="$RUNNER_TEMP/rust-test-bep-root.json"
          # Tests that need root (to chown a file to another uid) are named in
          # .github/sami/rust-test-root-targets.txt; each target is tagged
          # no-sandbox, since linux-sandbox maps one uid. They run in a second
          # invocation on the same server and cache, the test binary under
          # `sudo -E` (--run_under; GitHub's runner has passwordless sudo),
          # and every other target runs as the runner's user.
          roots=()
          declare -A root_tests=()
          while read -r target count _; do
            case "$target" in "" | "#"*) continue ;; esac
            roots+=("$target")
            root_tests["$target"]="$count"
          done <.github/sami/rust-test-root-targets.txt
          not_roots=()
          for target in "${roots[@]}"; do not_roots+=("-$target"); done
          rc=0
          # --keep_going: the ci config stops at the first target that fails to
          # build, and so skipped 7 of the 17 test targets in run 44694233578;
          # a release gate names every failure in one run.
          # -Zunstable-options --format=json (the toolchain is nightly,
          # .bazelrc): each libtest binary writes its own record to its log,
          # the number of tests it plans and then each one's result, so a
          # binary that exits 0 before its tests end shows, whatever a child
          # process printed. rules_rust's doctest runner passes the arguments
          # on to the doctest binaries and writes libtest's text summary itself.
          bazelisk --bazelrc="$OMP_BAZEL_RC" test --keep_going --test_arg=-Zunstable-options --test_arg=--format=json --build_event_json_file="$bep" -- //crates/... "${not_roots[@]}" || rc=$?
          # --show-output puts each passed test's output in its record, so a
          # root test that printed `not run:` (its precondition, root, broke)
          # can be failed below.
          rc_root=0
          if [ "${#roots[@]}" -gt 0 ]; then
            bazelisk --bazelrc="$OMP_BAZEL_RC" test --keep_going --run_under="sudo -E" --test_arg=-Zunstable-options --test_arg=--format=json --test_arg=--show-output --build_event_json_file="$bep_root" -- "${roots[@]}" || rc_root=$?
          fi
          # Bazel exits 0 when every test passed, 3 when every target built and
          # a test failed, and 1 when a target failed to build (the others
          # still built and ran). Any other code is Bazel itself failing, and
          # its event log cannot be trusted.
          for code in "$rc" "$rc_root"; do
            case "$code" in
              0 | 1 | 3) ;;
              *)
                echo "::error title=Rust tests::bazel test exited $code, which is neither a test nor a build failure"
                exit "$code"
                ;;
            esac
          done
          if [ "$rc" = 1 ] || [ "$rc_root" = 1 ]; then
            rc=1
          elif [ "$rc_root" = 3 ]; then
            rc=3
          fi
          # A list line is `<test target> <test name>  <reason>`.
          known="$RUNNER_TEMP/rust-test-known.txt"
          failed="$RUNNER_TEMP/rust-test-failed.txt"
          rows="$RUNNER_TEMP/rust-test-logs.tsv"
          awk '!/^[[:space:]]*(#|$)/ { print $1, $2 }' "$list" | LC_ALL=C sort -u >"$known"
          # Bazel's build event logs (the root invocation's too) name every
          # test target with its rule, its status and its test.log files: one
          # row per log, target, rule, status, which list Bazel put the log in
          # (passed or failed) and its path. The runner's jq is 1.6, which
          # refuses a keyword such as `label` as a variable name (run
          # 44696018007).
          beps=("$bep")
          if [ "${#roots[@]}" -gt 0 ]; then beps+=("$bep_root"); fi
          jq -rs '
            (map(select(.id.targetConfigured))
             | map({key: .id.targetConfigured.label, value: (.configured.targetKind // "unknown")})
             | from_entries) as $kinds
            | .[]
            | select(.id.testSummary)
            | .id.testSummary.label as $target
            | ($kinds[$target] // "unknown") as $rule
            | .testSummary.overallStatus as $status
            | ([(.testSummary.passed // [])[] | ["passed", .uri]]
               + [(.testSummary.failed // [])[] | ["failed", .uri]]) as $logs
            | if ($logs | length) == 0 then [$target, $rule, $status, "none", ""]
              else ($logs[] | [$target, $rule, $status, .[0], (.[1] | sub("^file://"; ""))]) end
            | @tsv' "${beps[@]}" >"$rows"
          if [ ! -s "$rows" ]; then
            echo "::error title=Rust tests::the build event log names no test target, so nothing shows that any test ran"
            exit 1
          fi
          if [ "$rc" = 3 ] && ! awk -F'\t' '$3 != "PASSED" { n++ } END { exit !n }' "$rows"; then
            echo "::error title=Rust tests::bazel test reported a failed test, but its build event log names no target that did not pass"
            exit 1
          fi
          # Cargo workspaces Bazel does not build (sdk/ is in .bazelignore),
          # listed in .github/sami/rust-test-cargo-workspaces.txt: every test
          # target of each runs under cargo with the root's pinned nightly, one
          # log per target, and each log is read as a rust_test log below.
          # The target is `<directory>:<kind>:<name>` (kind lib, bin, test,
          # example, bench or doc). A failed cargo metadata stops the step.
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error title=Rust tests::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$channel" --profile minimal --no-self-update
          n=0
          while read -r manifest _; do
            case "$manifest" in "" | "#"*) continue ;; esac
            dir="$(dirname "$manifest")"
            rustup run "$channel" cargo metadata --locked --no-deps --format-version 1 --manifest-path "$manifest" >"$RUNNER_TEMP/cargo-metadata.json"
            jq -r --arg dir "$dir" '
              .packages[] | .targets[]
              | (.kind[0]) as $kind
              | (if .test then [($dir + ":" + $kind + ":" + .name), (if $kind == "lib" then "--lib" else "--" + $kind end), (if $kind == "lib" then "" else .name end)] else empty end),
                (if .doctest and ([.crate_types[] | select(. == "lib" or . == "rlib" or . == "proc-macro")] | length > 0)
                 then [($dir + ":doc:" + .name), "--doc", ""] else empty end)
              | @tsv' "$RUNNER_TEMP/cargo-metadata.json" >"$RUNNER_TEMP/cargo-targets.tsv"
            if [ ! -s "$RUNNER_TEMP/cargo-targets.tsv" ]; then
              echo "::error title=Rust tests::$manifest names no test target"
              exit 1
            fi
            while IFS=$'\t' read -r label selector name; do
              n=$((n + 1))
              log="$RUNNER_TEMP/cargo-test-$n.log"
              code=0
              # shellcheck disable=SC2086 # $name is empty for --lib and --doc
              rustup run "$channel" cargo test --locked --manifest-path "$manifest" "$selector" $name -- -Zunstable-options --format=json >"$log" 2>"$log.err" || code=$?
              if [ "$code" = 0 ]; then
                printf '%s\tcargo test\tPASSED\tpassed\t%s\n' "$label" "$log" >>"$rows"
              else
                echo "::group::$label: cargo test exited $code"
                tail -n 50 "$log.err"
                echo "::endgroup::"
                printf '%s\tcargo test\tFAILED\tfailed\t%s\n' "$label" "$log" >>"$rows"
              fi
            done <"$RUNNER_TEMP/cargo-targets.tsv"
          done <.github/sami/rust-test-cargo-workspaces.txt
          if [ "$n" = 0 ]; then
            echo "::error title=Rust tests::.github/sami/rust-test-cargo-workspaces.txt names no workspace with a test target"
            exit 1
          fi
          : >"$failed"
          bad=0
          if [ "$rc" = 1 ]; then
            echo "::error title=Rust tests::a target failed to build (Bazel's FAILED TO BUILD lines above name it); no list line can account for that"
            bad=1
          fi
          # Bazel skips, without an error and without a result in the event
          # log, a test it finds incompatible with the runner (its own
          # target_compatible_with or a dependency's) or one a --test_*_filters
          # option leaves out. Every test target the pattern names, less those
          # tagged manual, must have a result. The query takes no --bazelrc:
          # the bazel-cache fragment's `common --config=ci` is defined for
          # build only, and query refuses it.
          tests="$RUNNER_TEMP/rust-test-targets.txt"
          if ! bazelisk query --output=label 'kind("_test rule$", //crates/...) - attr(tags, "manual", //crates/...)' >"$tests.raw"; then
            echo "::error title=Rust tests::bazel query for the test targets failed"
            exit 1
          fi
          LC_ALL=C sort -u "$tests.raw" >"$tests"
          if [ ! -s "$tests" ]; then
            echo "::error title=Rust tests::bazel query names no test target under //crates"
            exit 1
          fi
          cut -f1 "$rows" | LC_ALL=C sort -u >"$RUNNER_TEMP/rust-test-with-result.txt"
          while read -r label; do
            echo "::error title=Rust tests::$label is a test target, but bazel test has no result for it: skipped as incompatible with the runner, left out by a test filter, or not built"
            bad=1
          done < <(LC_ALL=C comm -23 "$tests" "$RUNNER_TEMP/rust-test-with-result.txt")
          # Bazel calls a target PASSED from its exit code alone, so a test
          # binary that exits 0 before libtest finishes (a test that calls
          # std::process::exit) passes there.
          # A rust_test log must hold libtest's JSON record whole: the planned
          # test_count, a result for every planned test, and the suite's end,
          # `ok` in a passed log. The failed tests are its `failed` events.
          # A rust_doc_test log is the doctest runner's text. Its first
          # `running N tests` header must equal its last summary's passed +
          # failed + ignored + measured, so a summary a child process printed
          # does not stand for the runner's; a passed log's last summary must
          # be `test result: ok.`. A failed one ends with `failures:`, each
          # failed doctest indented four spaces, a blank line and `test result:
          # FAILED.`, which the awk program reads.
          # A failed log that names no failed test (a crash, a timeout) fails
          # the job, since the list cannot account for it.
          while IFS=$'\t' read -r label rule status kind log; do
            if [ "$kind" = none ] || [ ! -f "$log" ]; then
              echo "::error title=Rust tests::$label is $status and Bazel names no test log for it"
              bad=1
              continue
            fi
            case "$rule" in
              "rust_test rule" | "cargo test")
                # A log can hold several suites (`cargo test --doc` runs one
                # binary per doctest that cannot be merged): the planned count
                # is the sum of every suite's test_count, and every started
                # suite must end.
                record="$(jq -R -s -r '
                  [split("\n")[] | fromjson? | select(type == "object")] as $events
                  | ($events | map(select(.type == "suite" and .event == "started"))) as $starts
                  | ($events | map(select(.type == "suite" and (.event == "ok" or .event == "failed")))) as $ends
                  | [(if ($starts | length) == 0 then -1 else ($starts | map(.test_count // 0) | add) end),
                     ($events | map(select(.type == "test" and (.event == "ok" or .event == "failed" or .event == "ignored"))) | length),
                     (if ($ends | length) != ($starts | length) then "none"
                      elif ($ends | map(select(.event == "failed")) | length) > 0 then "failed"
                      else "ok" end)]
                  | @tsv' "$log")"
                IFS=$'\t' read -r planned reported ended <<<"$record"
                if [ "$planned" -lt 0 ]; then
                  echo "::error title=Rust tests::$label is $status and its log holds no libtest record"
                  bad=1
                  continue
                fi
                if [ "$reported" != "$planned" ] || [ "$ended" = none ]; then
                  echo "::error title=Rust tests::$label is $status, but libtest planned $planned tests and reported $reported, suite end $ended: the test binary ended before its tests did"
                  bad=1
                  continue
                fi
                # A root target runs as root, so a test in it that printed
                # `not run:` skipped itself on a broken precondition, and it
                # must pass the number of tests its list line names. libtest
                # captures the tests' stderr into the record; a raw `not run:`
                # line outside the record (a write to fd 2) fails it too.
                for target in "${roots[@]}"; do
                  [ "$target" = "$label" ] || continue
                  while read -r skipped; do
                    echo "::error title=Rust tests::$label $skipped printed 'not run:', though it runs as root"
                    bad=1
                  done < <(jq -R -r 'fromjson? | select(type == "object" and .type == "test" and ((.stdout // "") | test("not run:"))) | .name' "$log")
                  if grep -v '^{' "$log" | grep -q 'not run:'; then
                    echo "::error title=Rust tests::$label printed 'not run:' outside libtest's record, though it runs as root: $(grep -v '^{' "$log" | grep -m1 'not run:')"
                    bad=1
                  fi
                  passed="$(jq -R -s -r '[split("\n")[] | fromjson? | select(type == "object" and .type == "test" and .event == "ok")] | length' "$log")"
                  if [ "$passed" != "${root_tests[$target]}" ]; then
                    echo "::error title=Rust tests::$label passed $passed tests, and .github/sami/rust-test-root-targets.txt names ${root_tests[$target]}"
                    bad=1
                  fi
                done
                if [ "$kind" = passed ]; then
                  if [ "$ended" != ok ]; then
                    echo "::error title=Rust tests::$label is $status, but libtest's suite ended $ended"
                    bad=1
                  fi
                  continue
                fi
                names="$(jq -R -r 'fromjson? | select(type == "object" and .type == "test" and .event == "failed") | .name' "$log")"
                echo "::group::$label failures"
                jq -R -r 'fromjson? | select(type == "object" and .type == "test" and .event == "failed") | "---- \(.name) ----\n\(.stdout // "")"' "$log"
                echo "::endgroup::"
                ;;
              "rust_doc_test rule")
                counts="$(awk '
                  !head && /^running [0-9]+ tests?$/ { head = $2 }
                  /^test result: / {
                    last = $0; sum = 0
                    n = split($0, word, /[ ;]+/)
                    for (i = 2; i <= n; i++) if (word[i] ~ /^(passed|failed|ignored|measured)$/) sum += word[i - 1]
                  }
                  END { printf "%s\t%s\t%s\n", (head == "" ? -1 : head), (last == "" ? -1 : sum), (last ~ /^test result: ok\./ ? "ok" : "not-ok") }
                ' "$log")"
                IFS=$'\t' read -r header summed verdict <<<"$counts"
                if [ "$header" -lt 0 ] || [ "$summed" != "$header" ]; then
                  echo "::error title=Rust tests::$label is $status, but its log's header plans $header doctests and its last summary counts $summed"
                  bad=1
                  continue
                fi
                if [ "$kind" = passed ]; then
                  if [ "$verdict" != ok ]; then
                    echo "::error title=Rust tests::$label is $status, but its log's last summary is not 'test result: ok.'"
                    bad=1
                  fi
                  continue
                fi
                names="$(awk '
                  /^failures:$/ { inlist = 1; names = ""; next }
                  inlist && /^    [^ ]/ { names = names substr($0, 5) "\n"; next }
                  inlist && /^$/ { next }
                  /^test result: FAILED\./ { printf "%s", names }
                  { inlist = 0; names = "" }
                ' "$log")"
                ;;
              *)
                echo "::error title=Rust tests::$label is a $rule, whose log this step cannot read"
                bad=1
                continue
                ;;
            esac
            if [ -z "$names" ]; then
              echo "::error title=Rust tests::$label is $status and its log names no failed test"
              bad=1
              continue
            fi
            printf '%s\n' "$names" | awk -v label="$label" '{ print label, $0 }' >>"$failed"
          done <"$rows"
          LC_ALL=C sort -u -o "$failed" "$failed"
          # comm writes to files, so a comm failure stops the step.
          LC_ALL=C comm -12 "$failed" "$known" >"$RUNNER_TEMP/rust-test-expected.txt"
          LC_ALL=C comm -23 "$failed" "$known" >"$RUNNER_TEMP/rust-test-unlisted.txt"
          LC_ALL=C comm -13 "$failed" "$known" >"$RUNNER_TEMP/rust-test-stale.txt"
          while read -r label name; do
            echo "Known failure, failed as expected: $label $name"
          done <"$RUNNER_TEMP/rust-test-expected.txt"
          while read -r label name; do
            echo "::error title=Rust test failed::$label $name failed and is not in $list"
            bad=1
          done <"$RUNNER_TEMP/rust-test-unlisted.txt"
          while read -r label name; do
            echo "::error title=Known failure passed::$label $name is in $list but did not fail: remove its line from the list"
            bad=1
          done <"$RUNNER_TEMP/rust-test-stale.txt"
          exit "$bad"
      - name: Every Rust test has a Bazel test target
        # `bazel test //crates/...` runs only Bazel test targets, and most of
        # pi-edit's, pi-shell's and pi-vcs's tests/*.rs files, obash's unit
        # tests and every doctest had none, so they ran nowhere. This fails
        # while any target of the repo's own suite (`bun run test:rs`) lacks
        # one, and names it. It runs after the tests, even when they failed,
        # so one run shows both.
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/sami/rust-test-parity.sh

  release_github:
    # A red Rust test stops the release: rust_test is a need like the builds.
    needs: [carry, version, release_binary, rust_test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mise-*
          path: release
          merge-multiple: true
      - uses: sjawhar/.github/.github/actions/sami-release@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          files: release/*.tar.gz
          body: |
            Automated build from the sami branch.

            Commit: ${{ github.sha }}

            ${{ needs.carry.outputs.notes }}

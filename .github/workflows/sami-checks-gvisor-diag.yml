# A diagnostic, not a check: why the pi-shell lib test binary dies of SIGSEGV (exit 139) under
# runsc 20261116.0 (systrap) on ubuntu-24.04 runners while GKE's gVisor Jobs pass it. It builds the
# lib test binary at Cut8's release (509a2d77) and Cut7's (a72018dd) and runs it in runsc
# containers of sami-checks-gvisor.yml's image (gvisor-diag.sh): the whole lib at 4 threads as the
# rows run it (the control: it must die as the rows did), at 1 thread at both trees, the two
# orphan_jobs tests the rows left unfinished each alone, on runsc's ptrace platform, and under
# an older runsc (20260810.0). Runs on a push that changes it, or a dispatch:
#   gh workflow run sami-checks-gvisor-diag.yml --repo cybermonklabs/oh-my-pi --ref feat/sami-checks-gvisor
# Security: permissions contents: read; no secrets; no cache; every checkout drops its credential.
name: sami checks gVisor diagnostic

on:
  push:
    branches:
      - feat/sami-checks-gvisor
    paths:
      - .github/workflows/sami-checks-gvisor-diag.yml
      - .github/sami-checks/gvisor-diag.sh
  workflow_dispatch:

permissions:
  contents: read

cache-mode: none

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SC: ${{ github.workspace }}/sc
  SC_TREE: ${{ github.workspace }}/tree
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  SC_TEST_PATH: /opt/sc-ref/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  tools:
    name: reference tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - run: bash tool/.github/sami-checks/tools.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/up/sc-tools.tgz
          retention-days: 1
          if-no-files-found: error

  build:
    name: build the lib test binary ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d }
          - { name: cut7, ref: a72018dd0059a8525dc2c76e19e62a414b40d7fa }
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Toolchain (the tree's rust-toolchain.toml channel, minimal profile)
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$SC_TREE/rust-toolchain.toml" | head -n 1)
          [ -n "$ch" ] || { echo "::error::no channel in the tree's rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$ch" >> "$GITHUB_ENV"
      - name: Build
        working-directory: tree
        run: |
          mkdir -p "$SC/up"
          cargo test -p pi-shell --lib --no-run --message-format=json-render-diagnostics > "$SC/build.json"
          bin=$(python3 -c 'import json, sys
          for line in open(sys.argv[1]):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("profile", {}).get("test") and m["target"]["name"] == "pi_shell" and m.get("executable"):
                  print(m["executable"])' "$SC/build.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no pi-shell lib test binary in cargo's output"; exit 1; }
          cp "$bin" "$SC/up/pi-shell-lib" && ls -l "$SC/up/pi-shell-lib"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-lib-${{ matrix.name }}
          path: ${{ github.workspace }}/sc/up/pi-shell-lib
          retention-days: 3
          if-no-files-found: error

  diag:
    name: ${{ matrix.case }}
    needs: [tools, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: control-cut8-systrap-4threads, tree: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d, runtime: runsc, mode: lib4 }
          - { case: orphan-tests-alone-cut8-systrap, tree: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d, runtime: runsc-dbg, mode: orphan }
          - { case: cut8-systrap-1thread, tree: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d, runtime: runsc, mode: lib1 }
          - { case: cut7-systrap-1thread, tree: cut7, ref: a72018dd0059a8525dc2c76e19e62a414b40d7fa, runtime: runsc, mode: lib1 }
          - { case: cut7-systrap-4threads, tree: cut7, ref: a72018dd0059a8525dc2c76e19e62a414b40d7fa, runtime: runsc, mode: lib4 }
          - { case: cut8-ptrace-4threads, tree: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d, runtime: runsc-ptrace, mode: lib4 }
          - { case: cut8-runsc-20260810-4threads, tree: cut8, ref: 509a2d771f0e195c3f7edb26069cb527c74c109d, runtime: runsc-old, mode: lib4 }
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false
          sparse-checkout: .github/sami-checks
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sc-tools
          path: ${{ github.workspace }}/sc/tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diag-lib-${{ matrix.tree }}
          path: ${{ github.workspace }}/sc/lib
      - name: gVisor and the test image
        run: bash tool/.github/sami-checks/gvisor-host.sh "$SC/tools/sc-tools.tgz"
      - name: Diagnostic
        run: bash tool/.github/sami-checks/gvisor-diag.sh host "${{ matrix.runtime }}" "${{ matrix.mode }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diag-${{ matrix.case }}
          path: ${{ github.workspace }}/sc/diag/
          retention-days: 7

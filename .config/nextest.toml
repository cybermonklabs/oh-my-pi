# nextest runs every test in its own process and schedules them in parallel
# across the whole workspace, so anything that relied on `cargo test`'s
# one-binary-at-a-time execution has to declare that here.
#
# Doctests are NOT run by nextest (upstream limitation: they have no stable
# libtest-json interface). `scripts/run-rs-task.ts` pairs the nextest run with
# `cargo test --doc`, which runs every runnable doctest in the workspace's lib
# crates. Today that is tree-sitter-go's one example: pi-natives is a `cdylib`
# (rustdoc collects no doctests from it) and pi-builtins' examples are
# `ignore`d vendored uutils docs.

[profile.default]
# Print each failure when it happens and again in the final summary — a run
# that fails early in a long workspace sweep should not need scrollback.
failure-output = "immediate-final"
# Report every failing test in one pass instead of stopping at the first.
fail-fast = false
# The one time bound of a nextest run. A test bounds no elapsed time of its
# own: it waits for the event it is about, however long a loaded host takes,
# and its fixtures outlive this bound. A test whose event never comes is
# failed here, by name, after 4 periods of 60 s. `test:rs`
# (`scripts/run-rs-task.ts`) runs this profile; the `ci` profile has the
# same bound. CI's Rust tests run under Bazel (`bazelisk test //crates/...`,
# `.github/workflows/ci.yml`), whose bound is its test timeout per target
# (300 s for a medium test): there a hung test fails its whole target, not
# named. `cargo test` has no bound.
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
# No retries: a flaky test is a bug we want to see, not paper over.
retries = 0
# Fails a hung test after 4 minutes, as the default profile does.
slow-timeout = { period = "60s", terminate-after = 4 }

# The deep-chain walk tests build and delete a directory chain as deep as the
# host's path syscalls reach. That saturates the filesystem for as long as they
# run, which pushes tests elsewhere in the workspace past their own latency
# assertions (pi-natives' OAuth callback wake, pi-shell's TERM-trap cleanup).
# Each takes every test thread, so it runs alone.
[[profile.default.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(deeper_than_the_stack) + test(stopping_at_the_leaf_of_a_deep_ignore_chain_returns)'
threads-required = "num-test-threads"

# The rsync conformance tests diff the builtin against the external reference
# rsync 3.5.1: they spawn its processes and daemons, run up to four scenarios
# at once on their own threads, and copy multi-megabyte fixtures per run. The
# reference's output already varies with scheduling, and a saturated machine
# starves its daemons past their readiness deadline. Each takes every test
# thread, so it runs alone.
[[profile.default.overrides]]
filter = 'test(/^rsync::conformance::/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'test(/^rsync::conformance::/)'
threads-required = "num-test-threads"

# cp's probe matrix runs 138,725 rows of cp against GNU's recorded answers, on
# every CPU. It ran as one test, which takes about 15 s on runc and 230 to 500 s
# under gVisor (GKE Sandbox), past the 240 s bound above; its bound was 20
# periods of 60 s (1,200 s). One test that long reports nothing while it runs,
# and the gate's runner (`.github/sami/libtest-bound.py`) fails the tests it is
# running once nothing has been reported for the longest bound among them: on
# runc beside 64 busy loops the matrix was stopped twice in 24 runs of the whole
# binary, at 1,201 s of silence, having run 1,552 s.
#
# It now runs as four pieces (`cp::tests::MATRIX_PIECES`), each a test of its
# own, taken one at a time on the whole worker pool, so a piece reports in about
# a quarter of the matrix's time; on a binary with eight test threads, four
# pieces leave half of them for the rest of the run, and on one with two there
# is no spare slot, one piece working while another waits. Eight pieces sharing
# the pool held every thread under heavy load,
# each finishing only when the whole matrix would have, and the run was stopped
# with 2,027 tests never run. Each
# piece's bound is the 20 periods of 60 s (1,200 s) the single test already had,
# because the quantity the runner compares with it is a *silence*, not a test's
# own duration: it stops the binary when no test has reported for the largest
# bound among the tests started and unreported. The longest such silence measured
# at the gate's own cell shape (2 CPUs of quota) is 217.6 s beside 16 busy loops
# and 594.9 s beside 32, so 1,200 s is 5.5 and 2.0 times it. Nothing is raised:
# the matrix had this allowance as one test, and now it reports four times inside
# it instead of once at the end. One override per piece, because the gate's runner (`libtest-bound.py`)
# reads a filter that names one test and refuses a regular expression.
[[profile.default.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_1)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_2)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_3)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_4)'
slow-timeout = { period = "60s", terminate-after = 20 }





[[profile.ci.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_1)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.ci.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_2)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.ci.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_3)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.ci.overrides]]
filter = 'package(pi-builtins) & test(=cp::tests::cp_does_what_gnu_does_across_the_probe_matrix_4)'
slow-timeout = { period = "60s", terminate-after = 20 }





# pi-shell's differential tests compare obash with the real zsh 5.9 and its
# completion functions where the machine has them, and compare nothing where
# it does not. Such a test passes either way, so it says so on stderr:
# `UNCOMPARED: <test>: <reason>` (tests/zsh_oracle). A passing test's output
# is hidden by default, so show these tests' output: a run on a machine
# without zsh 5.9 names every test that compared nothing.
[[profile.default.overrides]]
filter = 'package(pi-shell) & binary(/^(process_shell|process_signals|pty_harness|zle_hist_pty|zle_pty|zle_widgets_pty|zsh_comp_pty|zsh_comp_y0[123]|zsh_compctl_pty|zsh_computil_args_pty|zsh_computil_pty|zsh_jobs_pty|zsh_mod_curses|zsh_mod_files|zsh_mod_rlimits|zsh_mod_watch|zsh_parity_pty|zsh_zcompile)$/)'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'package(pi-shell) & binary(/^(process_shell|process_signals|pty_harness|zle_hist_pty|zle_pty|zle_widgets_pty|zsh_comp_pty|zsh_comp_y0[123]|zsh_compctl_pty|zsh_computil_args_pty|zsh_computil_pty|zsh_jobs_pty|zsh_mod_curses|zsh_mod_files|zsh_mod_rlimits|zsh_mod_watch|zsh_parity_pty|zsh_zcompile)$/)'
success-output = "immediate"

# Tests that need something of the host say so the same way when it lacks
# it, on a `skipped: <reason>` line: zftp's, a TCP port `/etc/services` names
# between 20000 and 60000; the collation test's, an en_US.UTF-8 collator.
[[profile.default.overrides]]
filter = 'package(pi-shell) & (binary(zsh_mod_zftp) | test(=testkit::suites::zsh_parity::expandmb_sorting_follows_lc_collate))'
success-output = "immediate"

[[profile.ci.overrides]]
filter = 'package(pi-shell) & (binary(zsh_mod_zftp) | test(=testkit::suites::zsh_parity::expandmb_sorting_follows_lc_collate))'
success-output = "immediate"

# pi-ast's whole-repository corpus test
# (`block::tests::pruned_walk_matches_unpruned_on_full_repo_corpus`, ignored:
# the gate runs it alone in an opt build) sweeps every file of the repository.
# Its correct gate runs took 152 to 240 s, at the 240 s bound above, which
# then failed two runs of it (sami-checks runs 45762751760 and 45762775961).
# Its bound is 10 periods of 60 s (600 s): more than twice its longest correct
# run, 240.2 s (run 45722788663), and below the 1,200 s Bazel gives the gate's
# ignored runs.
[[profile.default.overrides]]
filter = 'package(pi-ast) & test(=block::tests::pruned_walk_matches_unpruned_on_full_repo_corpus)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(pi-ast) & test(=block::tests::pruned_walk_matches_unpruned_on_full_repo_corpus)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The four symlink-swap tests run `rm -r`, `mv`'s tree removal and `find
# -delete` 2,000 times each while the path under them flips between a
# directory and a symlink, and reported nothing until they ended. While cp's
# probe matrix was one test that reported nothing for up to 1,552 s, the
# runner's quiet timer never came down to the 240 s default above, so these
# tests' own bound was never applied to them; with the matrix split they are
# the longest silence of a run. They are split the same way, into four pieces
# of 500 runs each, and each piece has its own bound here: 5 periods of 60 s
# (300 s), more than five times the longest such piece measured in the same
# whole-binary runs, 56.3 s.

